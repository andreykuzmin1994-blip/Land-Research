<text x="40.0" y="688.0" font-size="12" text-anchor="start" font-weight="normal">Constrained 0%: floodplain, wetlands and water, easements, protected land</text>
<rect x="20" y="696.0" width="14" height="10" fill="#cfe8c4" stroke="#222222" stroke-width="1.0"/>
<text x="40.0" y="706.0" font-size="12" text-anchor="start" font-weight="normal">Largest open part 8.5 ac</text>
<rect x="20" y="714.0" width="14" height="10" fill="#f2c9a0" stroke="#b5534a" stroke-width="1.0"/>
<text x="40.0" y="724.0" font-size="12" text-anchor="start" font-weight="normal">Envelope: front-load 200 ft deep + trailer row (test) 400 x 200 ft building, 80,000</text>
<text x="40.0" y="742.0" font-size="12" text-anchor="start" font-weight="normal">SF (+ 130 ft truck court + 55 ft trailer row)</text>
<rect x="20" y="750.0" width="14" height="10" fill="#7fc4bd" stroke="#1f6f68" stroke-width="1.0"/>
<text x="40.0" y="760.0" font-size="12" text-anchor="start" font-weight="normal">Detention pond 400 x 200 ft beside the envelope: rough allowance, no hydrology</text>

<rect x="20" y="768.0" width="14" height="10" fill="url(#hx)" stroke="#c92a2a" stroke-width="1.0"/>
<text x="40.0" y="778.0" font-size="12" text-anchor="start" font-weight="normal">Test cut 25% of the parcel (red hatch): residential zoning outside the assemblage</text>
<text x="40.0" y="796.0" font-size="12" text-anchor="start" font-weight="normal">(city layer, measured from the zoning line) + 100 ft test buffer. Not a mapped</text>
<text x="40.0" y="814.0" font-size="12" text-anchor="start" font-weight="normal">constraint; it is also shaded blue.</text>
<rect x="20" y="822.0" width="14" height="10" fill="#f4f1ea" stroke="#222222" stroke-width="1.0"/>
<text x="40.0" y="832.0" font-size="12" text-anchor="start" font-weight="normal">The same building without leaving room for the pond: up to 88,000 SF (440 ft long).</text>
<text x="40.0" y="850.0" font-size="12" text-anchor="start" font-weight="normal">Sizes are lower bounds (two search orders tried).</text>
<rect x="20" y="858.0" width="14" height="10" fill="#f4f1ea" stroke="#222222" stroke-width="1.0"/>
<text x="40.0" y="868.0" font-size="12" text-anchor="start" font-weight="normal">Acres: 11.4 county map, 11.7 tax roll; steep share (run&#x27;s lidar check) 8.3% area-</text>
<text x="40.0" y="886.0" font-size="12" text-anchor="start" font-weight="normal">weighted over the 9.4 tax-roll ac checked (2.3 ac not checked): steep ground not</text>
<text x="40.0" y="904.0" font-size="12" text-anchor="start" font-weight="normal">located</text>
<rect x="20" y="912.0" width="14" height="10" fill="#f4f1ea" stroke="#222222" stroke-width="1.0"/>
<text x="40.0" y="922.0" font-size="12" text-anchor="start" font-weight="normal">Assumes the two R-4 house lots and the vacant R-4 lot (1.3 ac together) are bought</text>
<text x="40.0" y="940.0" font-size="12" text-anchor="start" font-weight="normal">and rezoned industrial; the rear lot is already I-1.</text>
<text x="20.0" y="958.0" font-size="11" text-anchor="start" font-weight="normal">North up. Steep ground not shown. A screening sketch, not a survey.</text>

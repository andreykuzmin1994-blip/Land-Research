.9 M517.7,187.9 L509.2,183.6" stroke="#4a3f35" stroke-width="1.4" fill="none"/><path d="M376.7,593.2 L270.4,539.0 L193.1,690.7 L299.4,744.9 Z" fill="#d7ece8" fill-opacity="1.0" stroke="#2a7f74" stroke-width="0.8" fill-rule="evenodd" /><path d="M360.6,598.4 L294.2,728.8 L209.1,685.5 L275.6,555.1 Z" fill="#8ccfc4" fill-opacity="1.0" stroke="#2a7f74" stroke-width="1.2" fill-rule="evenodd" /><path d="M110.9,785.0 L110.8,785.0 L110.7,785.0 L110.6,785.0 L110.5,784.9 L110.5,784.9 L110.4,784.9 L110.3,784.8 L110.3,784.8 L110.2,784.7 L110.2,784.7 L110.1,784.6 L110.1,784.5 L110.1,784.4 L110.1,784.4 L110.0,784.3 L110.0,784.2 L110.0,784.1 L110.1,784.0 L110.1,784.0 L110.1,783.9 L435.2,35.5 L435.2,35.4 L435.3,35.3 L435.3,35.3 L435.4,35.2 L435.4,35.2 L435.5,35.1 L435.6,35.1 L435.6,35.1 L435.7,35.0 L435.8,35.0 L435.9,35.0 L435.9,35.0 L436.0,35.0 L436.1,35.0 L436.2,35.0 L436.2,35.1 L709.5,161.6 L709.6,161.6 L709.6,161.7 L709.7,161.7 L709.8,161.8 L709.8,161.8 L709.8,161.9 L709.9,162.0 L709.9,162.0 L709.9,162.1 L709.9,162.2 L710.0,162.3 L710.0,162.4 L709.9,162.4 L709.9,162.5 L709.9,162.6 L709.9,162.7 L397.1,776.7 L397.1,776.8 L397.0,776.9 L397.0,776.9 L396.9,777.0 L396.9,777.0 L396.8,777.1 L396.7,777.1 L396.7,777.1 L396.6,777.1 L396.5,777.1 L396.4,777.2 Z" fill="none" fill-opacity="1.0" stroke="#1f2a30" stroke-width="1.6" fill-rule="evenodd" /><text x="524.4" y="318.8" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2a30">67,000 SF</text><path d="M780,30 L788,56 L780,50 L772,56 Z" fill="#1f2a30"/><text x="780" y="70" font-size="12" text-anchor="middle" font-weight="bold">N</text><path d="M20,808 L178.9,808" stroke="#1f2a30" stroke-width="3"/><text x="184.9" y="812" font-size="11">200 ft</text><text x="822" y="43" font-size="15" font-weight="bold" fill="#1f2a30">HYPOTHETICAL: no road frontage. #13 0 M L KING JR DR</text><text x="822" y="62" font-size="15" font-weight="bold" fill="#1f2a30">R, Fulton Industrial District (7.7 ac tax roll)</text><text x="822" y="78" font-size="11.5" font-weight="normal" fill="#1f2a30">rear-load 160 deep, court only, cars at office end (market depth,</text><text x="822" y="93" font-size="11.5" font-weight="normal" fill="#1f2a30">not an operator prototype)</text><text x="822" y="108" font-size="11.5" font-weight="bold" fill="#1f2a30">67,000 SF   420 x 160 ft   32 ft clear (assumed)</text><text x="822" y="124" font-size="11.5" font-weight="normal" fill="#1f2a30">Dock doors 13   office ~1,500 SF</text><text x="822" y="140" font-size="11.5" font-weight="normal" fill="#1f2a30">Trailer stalls 0 (court rows 0, drop yard 0) vs target 7</text><text x="822" y="155" font-size="11.5" font-weight="normal" fill="#1f2a30">Car stalls 70 (required 68; ADA 3; 9 x 18 ft)</text><text x="822" y="170" font-size="11.5" font-weight="normal" fill="#1f2a30">Site 7.7 ac (county map)   8,800 SF/gross ac   FAR 0.2</text><text x="822" y="186" font-size="11.5" font-weight="normal" fill="#1f2a30">Impervious 5.0 ac (65%)</text><text x="822" y="202" font-size="11.5" font-weight="normal" fill="#1f2a30">Detention 1.9 ac-ft in 1 pond(s)</text><text x="822" y="217" font-size="11.5" font-weight="normal" fill="#1f2a30">Access: no truck driveway; no road; frontage 0 ft</text><text x="822" y="232" font-size="11.5" font-weight="normal" fill="#1f2a30">Graded area: relief ~21 ft, balanced cut/fill ~17,000 CY, steep</text><text x="822" y="248" font-size="11.5" font-weight="normal" fill="#1f2a30">15%</text><text x="822" y="265" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="280" font-size="11.5" font-weight="normal" fill="#b3261e">!! ACCESS_NONE: no public road frontage from the GDOT check:</text><text x="822" y="296" font-size="11.5" font-weight="normal" fill="#b3261e">landlocked or access by easement only; the plan is hypothetical</text><text x="822" y="312" font-size="11.5" font-weight="normal" fill="#b3261e">and its floor area is not counted</text><text x="822" y="327" font-size="11.5" font-weight="normal" fill="#8a5a00">! TRAILER_SHORT: 0 trailer stalls against a target of 7</text><text x="822" y="342" font-size="11.5" font-weight="normal" fill="#8a5a00">! GRADING_RISK: 15% of the graded area is steeper than 15% (lidar)</text><text x="822" y="358" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="374" font-size="11.5" font-weight="normal" fill="#8a5a00">for fulton industrial; zoning_rules.json is the authority</text><text x="822" y="389" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="404" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="420" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 8,765 SF per gross acre; Georgia comps run</text><text x="822" y="436" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="451" font-size="11.5" font-weight="normal" fill="#5d676e">i IMPERVIOUS_RATIO: impervious / building footprint 3.3 (comps</text><text x="822" y="466" font-size="11.5" font-weight="normal" fill="#5d676e">about 2.0-2.1)</text><text x="822" y="482" font-size="11.5" font-weight="normal" fill="#5d676e">i POND_SITE_FROM_LIDAR: pond placed low, near the module and on</text><text x="822" y="498" font-size="11.5" font-weight="normal" fill="#5d676e">its side of mapped wetlands; no outfall, maintenance drive or</text><text x="822" y="513" font-size="11.5" font-weight="normal" fill="#5d676e">grading design</text><rect x="822" y="527.0" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="536.0" font-size="11">building, office pods, dock doors</text><rect x="822" y="543.0" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="552.0" font-size="11">truck court</text><rect x="822" y="559.0" width="18" height="10" fill="#bfc5ca" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="568.0" font-size="11">truck roads and truck route</text><rect x="822" y="575.0" width="18" height="10" fill="#a7adb3" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="584.0" font-size="11">trailer stalls / drop yard</text><rect x="822" y="591.0" width="18" height="10" fill="#dfe3f1" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="600.0" font-size="11">car parking and car route</text><rect x="822" y="607.0" width="18" height="10" fill="#8ccfc4" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="616.0" font-size="11">detention pond (rim around)</text><rect x="822" y="623.0" width="18" height="10" fill="#9cc3e0" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="632.0" font-size="11">floodplain, wetlands, easements, protected</text><rect x="822" y="639.0" width="18" height="10" fill="url(#tx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="648.0" font-size="11">transmission corridor (assumed width)</text><rect x="822" y="655.0" width="18" height="10" fill="url(#sx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="664.0" font-size="11">steeper than 15% (lidar)</text><rect x="822" y="671.0" width="18" height="10" fill="url(#cx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="680.0" font-size="11">test cut</text><path d="M822,692.0 L840,692.0" stroke="#7a8a94" stroke-dasharray="6 4" stroke-width="1.5"/><text x="848" y="696.0" font-size="11">paving envelope (draft setbacks/buffers, 25 ft from water)</text><rect x="822" y="703.0" width="18" height="10" fill="#d9480f" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="712.0" font-size="11">GDOT road frontage; T/C driveways</text><text x="822" y="733" font-size="10.5" fill="#5d676e">Screening test fit from public data: not a survey, civil design or zoning</text><text x="822" y="746" font-size="10.5" fill="#5d676e">determination. Zoning values are draft; detention is a +/-30% estimate;</text><text x="822" y="759" font-size="10.5" fill="#5d676e">routes, fire access and grading are indicative.</text></svg>
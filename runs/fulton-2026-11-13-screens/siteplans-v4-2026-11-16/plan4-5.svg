0" y="70" font-size="12" text-anchor="middle" font-weight="bold">N</text><path d="M20,808 L128.8,808" stroke="#1f2a30" stroke-width="3"/><text x="134.8" y="812" font-size="11">200 ft</text><text x="822" y="43" font-size="15" font-weight="bold" fill="#1f2a30">HYPOTHETICAL: no road frontage. #5 0 STACKS RD REAR,</text><text x="822" y="62" font-size="15" font-weight="bold" fill="#1f2a30">South Fulton / unincorporated (12.8 ac tax roll)</text><text x="822" y="78" font-size="11.5" font-weight="normal" fill="#1f2a30">rear-load 160 deep, court only, cars along office wall (market</text><text x="822" y="93" font-size="11.5" font-weight="normal" fill="#1f2a30">depth, not an operator prototype)</text><text x="822" y="108" font-size="11.5" font-weight="bold" fill="#1f2a30">115,000 SF   720 x 160 ft   32 ft clear (assumed)</text><text x="822" y="124" font-size="11.5" font-weight="normal" fill="#1f2a30">Dock doors 23   office ~2,500 SF</text><text x="822" y="140" font-size="11.5" font-weight="normal" fill="#1f2a30">Trailer stalls 12 (court rows 0, drop yard 12) vs target 12</text><text x="822" y="155" font-size="11.5" font-weight="normal" fill="#1f2a30">Car stalls 85 (required 81; ADA 4; 9 x 18 ft)</text><text x="822" y="170" font-size="11.5" font-weight="normal" fill="#1f2a30">Site 12.2 ac (county map)   9,500 SF/gross ac   FAR 0.22</text><text x="822" y="186" font-size="11.5" font-weight="normal" fill="#1f2a30">Impervious 7.2 ac (59%)</text><text x="822" y="202" font-size="11.5" font-weight="normal" fill="#1f2a30">Detention 2.7 ac-ft in 1 pond(s)</text><text x="822" y="217" font-size="11.5" font-weight="normal" fill="#1f2a30">Access: no truck driveway; no road; frontage 0 ft</text><text x="822" y="232" font-size="11.5" font-weight="normal" fill="#1f2a30">Graded area: relief ~28 ft, balanced cut/fill ~31,000 CY, steep 2%</text><text x="822" y="250" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="265" font-size="11.5" font-weight="normal" fill="#b3261e">!! ACCESS_NONE: no public road frontage from the GDOT check:</text><text x="822" y="280" font-size="11.5" font-weight="normal" fill="#b3261e">landlocked or access by easement only; the plan is hypothetical</text><text x="822" y="296" font-size="11.5" font-weight="normal" fill="#b3261e">and its floor area is not counted</text><text x="822" y="312" font-size="11.5" font-weight="normal" fill="#8a5a00">! RESIDENTIAL_EDGE: about 40 ft of boundary touches residential</text><text x="822" y="327" font-size="11.5" font-weight="normal" fill="#8a5a00">parcels (county land-use codes); draft buffers applied</text><text x="822" y="342" font-size="11.5" font-weight="normal" fill="#8a5a00">! RELIEF: about 28 ft of relief across the graded area: terraces</text><text x="822" y="358" font-size="11.5" font-weight="normal" fill="#8a5a00">or retaining walls likely</text><text x="822" y="374" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="389" font-size="11.5" font-weight="normal" fill="#8a5a00">for south fulton; zoning_rules.json is the authority</text><text x="822" y="404" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="420" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="436" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 9,476 SF per gross acre; Georgia comps run</text><text x="822" y="451" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="466" font-size="11.5" font-weight="normal" fill="#5d676e">i LD_OUT_OF_BAND: length/depth 4.5 (comps 2.0-3.8)</text><text x="822" y="482" font-size="11.5" font-weight="normal" fill="#5d676e">i IMPERVIOUS_RATIO: impervious / building footprint 2.7 (comps</text><text x="822" y="498" font-size="11.5" font-weight="normal" fill="#5d676e">about 2.0-2.1)</text><text x="822" y="513" font-size="11.5" font-weight="normal" fill="#5d676e">i POND_SITE_FROM_LIDAR: pond placed low, near the module and on</text><text x="822" y="528" font-size="11.5" font-weight="normal" fill="#5d676e">its side of mapped wetlands; no outfall, maintenance drive or</text><text x="822" y="544" font-size="11.5" font-weight="normal" fill="#5d676e">grading design</text><rect x="822" y="558.0" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="567.0" font-size="11">building, office pods, dock doors</text><rect x="822" y="574.0" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="583.0" font-size="11">truck court</text><rect x="822" y="590.0" width="18" height="10" fill="#bfc5ca" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="599.0" font-size="11">truck roads and truck route</text><rect x="822" y="606.0" width="18" height="10" fill="#a7adb3" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="615.0" font-size="11">trailer stalls / drop yard</text><rect x="822" y="622.0" width="18" height="10" fill="#dfe3f1" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="631.0" font-size="11">car parking and car route</text><rect x="822" y="638.0" width="18" height="10" fill="#8ccfc4" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="647.0" font-size="11">detention pond (rim around)</text><rect x="822" y="654.0" width="18" height="10" fill="#9cc3e0" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="663.0" font-size="11">floodplain, wetlands, easements, protected</text><rect x="822" y="670.0" width="18" height="10" fill="url(#tx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="679.0" font-size="11">transmission corridor (assumed width)</text><rect x="822" y="686.0" width="18" height="10" fill="url(#sx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="695.0" font-size="11">steeper than 15% (lidar)</text><rect x="822" y="702.0" width="18" height="10" fill="url(#cx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="711.0" font-size="11">test cut</text><path d="M822,723.0 L840,723.0" stroke="#7a8a94" stroke-dasharray="6 4" stroke-width="1.5"/><text x="848" y="727.0" font-size="11">paving envelope (draft setbacks/buffers, 25 ft from water)</text><rect x="822" y="734.0" width="18" height="10" fill="#d9480f" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="743.0" font-size="11">GDOT road frontage; T/C driveways</text><text x="822" y="764" font-size="10.5" fill="#5d676e">Screening test fit from public data: not a survey, civil design or zoning</text><text x="822" y="777" font-size="10.5" fill="#5d676e">determination. Zoning values are draft; detention is a +/-30% estimate;</text><text x="822" y="790" font-size="10.5" fill="#5d676e">routes, fire access and grading are indicative.</text></svg>
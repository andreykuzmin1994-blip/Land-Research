"250" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="265" font-size="11.5" font-weight="normal" fill="#8a5a00">! RESIDENTIAL_EDGE: about 5,237 ft of boundary touches residential</text><text x="822" y="280" font-size="11.5" font-weight="normal" fill="#8a5a00">parcels (county land-use codes); draft buffers applied</text><text x="822" y="296" font-size="11.5" font-weight="normal" fill="#8a5a00">! ACCESS_SHARED: one driveway: cars split from trucks inside the</text><text x="822" y="312" font-size="11.5" font-weight="normal" fill="#8a5a00">throat</text><text x="822" y="327" font-size="11.5" font-weight="normal" fill="#8a5a00">! FIRE_SECOND_ACCESS: 1 driveway(s): a second fire access</text><text x="822" y="342" font-size="11.5" font-weight="normal" fill="#8a5a00">(emergency-only link) or fire-official approval needed</text><text x="822" y="358" font-size="11.5" font-weight="normal" fill="#8a5a00">! LOADING_FACES_RES: a truck court or trailer row is within 150 ft</text><text x="822" y="374" font-size="11.5" font-weight="normal" fill="#8a5a00">of a residential edge (50 ft loading strip and screening likely)</text><text x="822" y="389" font-size="11.5" font-weight="normal" fill="#8a5a00">! RELIEF: about 48 ft of relief across the graded area: terraces</text><text x="822" y="404" font-size="11.5" font-weight="normal" fill="#8a5a00">or retaining walls likely</text><text x="822" y="420" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="436" font-size="11.5" font-weight="normal" fill="#8a5a00">for south fulton; zoning_rules.json is the authority</text><text x="822" y="451" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="466" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="482" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 4,473 SF per gross acre; Georgia comps run</text><text x="822" y="498" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="513" font-size="11.5" font-weight="normal" fill="#5d676e">i LD_OUT_OF_BAND: length/depth 4.5 (comps 2.0-3.8)</text><text x="822" y="528" font-size="11.5" font-weight="normal" fill="#5d676e">i IMPERVIOUS_RATIO: impervious / building footprint 3.2 (comps</text><text x="822" y="544" font-size="11.5" font-weight="normal" fill="#5d676e">about 2.0-2.1)</text><text x="822" y="560" font-size="11.5" font-weight="normal" fill="#5d676e">i POND_SITE_FROM_LIDAR: pond placed low, near the module and on</text><text x="822" y="575" font-size="11.5" font-weight="normal" fill="#5d676e">its side of mapped wetlands; no outfall, maintenance drive or</text><text x="822" y="590" font-size="11.5" font-weight="normal" fill="#5d676e">grading design</text><rect x="822" y="604.5" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="613.5" font-size="11">building, office pods, dock doors</text><rect x="822" y="620.5" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="629.5" font-size="11">truck court</text><rect x="822" y="636.5" width="18" height="10" fill="#bfc5ca" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="645.5" font-size="11">truck roads and truck route</text><rect x="822" y="652.5" width="18" height="10" fill="#a7adb3" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="661.5" font-size="11">trailer stalls / drop yard</text><rect x="822" y="668.5" width="18" height="10" fill="#dfe3f1" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="677.5" font-size="11">car parking and car route</text><rect x="822" y="684.5" width="18" height="10" fill="#8ccfc4" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="693.5" font-size="11">detention pond (rim around)</text><rect x="822" y="700.5" width="18" height="10" fill="#9cc3e0" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="709.5" font-size="11">floodplain, wetlands, easements, protected</text><rect x="822" y="716.5" width="18" height="10" fill="url(#tx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="725.5" font-size="11">transmission corridor (assumed width)</text><rect x="822" y="732.5" width="18" height="10" fill="url(#sx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="741.5" font-size="11">steeper than 15% (lidar)</text><rect x="822" y="748.5" width="18" height="10" fill="url(#cx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="757.5" font-size="11">test cut</text><path d="M822,769.5 L840,769.5" stroke="#7a8a94" stroke-dasharray="6 4" stroke-width="1.5"/><text x="848" y="773.5" font-size="11">paving envelope (draft setbacks/buffers, 25 ft from water)</text><rect x="822" y="780.5" width="18" height="10" fill="#d9480f" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="789.5" font-size="11">GDOT road frontage; T/C driveways</text><text x="822" y="810" font-size="10.5" fill="#5d676e">Screening test fit from public data: not a survey, civil design or zoning</text><text x="822" y="824" font-size="10.5" fill="#5d676e">determination. Zoning values are draft; detention is a +/-30% estimate;</text><text x="822" y="836" font-size="10.5" fill="#5d676e">routes, fire access and grading are indicative.</text></svg>
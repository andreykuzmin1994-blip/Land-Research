,808" stroke="#1f2a30" stroke-width="3"/><text x="127.6" y="812" font-size="11">200 ft</text><text x="822" y="43" font-size="15" font-weight="bold" fill="#1f2a30">NOT FEASIBLE (see !! flags). #41 0 OLD SENOIA RD,</text><text x="822" y="62" font-size="15" font-weight="bold" fill="#1f2a30">South Fulton / unincorporated (15.4 ac tax roll)</text><text x="822" y="78" font-size="11.5" font-weight="normal" fill="#1f2a30">rear-load 190 deep, court only, cars along office wall (market</text><text x="822" y="93" font-size="11.5" font-weight="normal" fill="#1f2a30">depth, not an operator prototype)</text><text x="822" y="108" font-size="11.5" font-weight="bold" fill="#1f2a30">129,000 SF   680 x 190 ft   32 ft clear (assumed)</text><text x="822" y="124" font-size="11.5" font-weight="normal" fill="#1f2a30">Dock doors 26   office ~2,500 SF</text><text x="822" y="140" font-size="11.5" font-weight="normal" fill="#1f2a30">Trailer stalls 13 (court rows 0, drop yard 13) vs target 13</text><text x="822" y="155" font-size="11.5" font-weight="normal" fill="#1f2a30">Car stalls 95 (required 91; ADA 4; 9 x 18 ft)</text><text x="822" y="170" font-size="11.5" font-weight="normal" fill="#1f2a30">Site 15.4 ac (county map)   8,400 SF/gross ac   FAR 0.19</text><text x="822" y="186" font-size="11.5" font-weight="normal" fill="#1f2a30">Impervious 8.0 ac (52%)</text><text x="822" y="202" font-size="11.5" font-weight="normal" fill="#1f2a30">Detention 3.0 ac-ft in 0 pond(s) - see flags</text><text x="822" y="217" font-size="11.5" font-weight="normal" fill="#1f2a30">Access: truck (T) + car (C); local road, GDOT route 1121200061900;</text><text x="822" y="232" font-size="11.5" font-weight="normal" fill="#1f2a30">frontage 536 ft</text><text x="822" y="248" font-size="11.5" font-weight="normal" fill="#1f2a30">Graded area: relief ~46 ft, balanced cut/fill ~53,000 CY, steep 5%</text><text x="822" y="265" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="280" font-size="11.5" font-weight="normal" fill="#b3261e">!! CAR_ROUTE_NONE: no car route from a driveway to the car field</text><text x="822" y="296" font-size="11.5" font-weight="normal" fill="#b3261e">without crossing truck pavement</text><text x="822" y="312" font-size="11.5" font-weight="normal" fill="#8a5a00">! RESIDENTIAL_EDGE: about 2,183 ft of boundary touches residential</text><text x="822" y="327" font-size="11.5" font-weight="normal" fill="#8a5a00">parcels (county land-use codes); draft buffers applied</text><text x="822" y="342" font-size="11.5" font-weight="normal" fill="#8a5a00">! FIRE_SECOND_ACCESS: driveways 259 ft apart, under half the</text><text x="822" y="358" font-size="11.5" font-weight="normal" fill="#8a5a00">building diagonal (353 ft)</text><text x="822" y="374" font-size="11.5" font-weight="normal" fill="#8a5a00">! POND_DOES_NOT_FIT: 1 pond(s) of 3.0 ac-ft do not fit on the</text><text x="822" y="389" font-size="11.5" font-weight="normal" fill="#8a5a00">development side: underground detention (vaults) or a smaller</text><text x="822" y="404" font-size="11.5" font-weight="normal" fill="#8a5a00">building</text><text x="822" y="420" font-size="11.5" font-weight="normal" fill="#8a5a00">! LOADING_FACES_RES: a truck court or trailer row is within 150 ft</text><text x="822" y="436" font-size="11.5" font-weight="normal" fill="#8a5a00">of a residential edge (50 ft loading strip and screening likely)</text><text x="822" y="451" font-size="11.5" font-weight="normal" fill="#8a5a00">! RELIEF: about 46 ft of relief across the graded area: terraces</text><text x="822" y="466" font-size="11.5" font-weight="normal" fill="#8a5a00">or retaining walls likely</text><text x="822" y="482" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="498" font-size="11.5" font-weight="normal" fill="#8a5a00">for south fulton; zoning_rules.json is the authority</text><text x="822" y="513" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="528" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="544" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 8,412 SF per gross acre; Georgia comps run</text><text x="822" y="560" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="575" font-size="11.5" font-weight="normal" fill="#5d676e">i IMPERVIOUS_RATIO: impervious / building footprint 2.7 (comps</text><text x="822" y="590" font-size="11.5" font-weight="normal" fill="#5d676e">about 2.0-2.1)</text><rect x="822" y="604.5" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="613.5" font-size="11">building, office pods, dock doors</text><rect x="822" y="620.5" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="629.5" font-size="11">truck court</text><rect x="822" y="636.5" width="18" height="10" fill="#bfc5ca" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="645.5" font-size="11">truck roads and truck route</text><rect x="822" y="652.5" width="18" height="10" fill="#a7adb3" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="661.5" font-size="11">trailer stalls / drop yard</text><rect x="822" y="668.5" width="18" height="10" fill="#dfe3f1" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="677.5" font-size="11">car parking and car route</text><rect x="822" y="684.5" width="18" height="10" fill="#8ccfc4" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="693.5" font-size="11">detention pond (rim around)</text><rect x="822" y="700.5" width="18" height="10" fill="#9cc3e0" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="709.5" font-size="11">floodplain, wetlands, easements, protected</text><rect x="822" y="716.5" width="18" height="10" fill="url(#tx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="725.5" font-size="11">transmission corridor (assumed width)</text><rect x="822" y="732.5" width="18" height="10" fill="url(#sx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="741.5" font-size="11">steeper than 15% (lidar)</text><rect x="822" y="748.5" width="18" height="10" fill="url(#cx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="757.5" font-size="11">test cut</text><path d="M822,769.5 L840,769.5" stroke="#7a8a94" stroke-dasharray="6 4" stroke-width="1.5"/><text x="848" y="773.5" font-size="11">paving envelope (draft setbacks/buffers, 25 ft from water)</text><rect x="822" y="780.5" width="18" height="10" fill="#d9480f" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="789.5" font-size="11">GDOT road frontage; T/C driveways</text><text x="822" y="810" font-size="10.5" fill="#5d676e">Screening test fit from public data: not a survey, civil design or zoning</text><text x="822" y="824" font-size="10.5" fill="#5d676e">determination. Zoning values are draft; detention is a +/-30% estimate;</text><text x="822" y="836" font-size="10.5" fill="#5d676e">routes, fire access and grading are indicative.</text></svg>
="normal" fill="#1f2a30">Dock doors 13   office ~1,500 SF</text><text x="822" y="140" font-size="11.5" font-weight="normal" fill="#1f2a30">Trailer stalls 7 (court rows 7, drop yard 0) vs target 7</text><text x="822" y="155" font-size="11.5" font-weight="normal" fill="#1f2a30">Car stalls 70 (required 68; ADA 3; 9 x 18 ft)</text><text x="822" y="170" font-size="11.5" font-weight="normal" fill="#1f2a30">Site 9.4 ac (county map)   7,100 SF/gross ac   FAR 0.16</text><text x="822" y="186" font-size="11.5" font-weight="normal" fill="#1f2a30">Impervious 5.0 ac (53%)</text><text x="822" y="202" font-size="11.5" font-weight="normal" fill="#1f2a30">Detention 1.9 ac-ft in 1 pond(s)</text><text x="822" y="217" font-size="11.5" font-weight="normal" fill="#1f2a30">Access: truck (T) + car (C); minor arterial, GDOT route</text><text x="822" y="232" font-size="11.5" font-weight="normal" fill="#1f2a30">1121200138800; frontage 947 ft</text><text x="822" y="248" font-size="11.5" font-weight="normal" fill="#1f2a30">Graded area: relief ~46 ft, balanced cut/fill ~38,000 CY, steep</text><text x="822" y="264" font-size="11.5" font-weight="normal" fill="#1f2a30">18%</text><text x="822" y="280" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="296" font-size="11.5" font-weight="normal" fill="#8a5a00">! GRADING_RISK: 18% of the graded area is steeper than 15% (lidar)</text><text x="822" y="312" font-size="11.5" font-weight="normal" fill="#8a5a00">! RELIEF: about 46 ft of relief across the graded area: terraces</text><text x="822" y="327" font-size="11.5" font-weight="normal" fill="#8a5a00">or retaining walls likely</text><text x="822" y="342" font-size="11.5" font-weight="normal" fill="#8a5a00">! ACREAGE_MISMATCH: county map 9.4 ac vs tax roll 11.2 ac</text><text x="822" y="358" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="374" font-size="11.5" font-weight="normal" fill="#8a5a00">for south fulton; zoning_rules.json is the authority</text><text x="822" y="389" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="404" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="420" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 7,122 SF per gross acre; Georgia comps run</text><text x="822" y="436" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="451" font-size="11.5" font-weight="normal" fill="#5d676e">i IMPERVIOUS_RATIO: impervious / building footprint 3.3 (comps</text><text x="822" y="466" font-size="11.5" font-weight="normal" fill="#5d676e">about 2.0-2.1)</text><text x="822" y="482" font-size="11.5" font-weight="normal" fill="#5d676e">i POND_SITE_FROM_LIDAR: pond placed low, near the module and on</text><text x="822" y="498" font-size="11.5" font-weight="normal" fill="#5d676e">its side of mapped wetlands; no outfall, maintenance drive or</text><text x="822" y="513" font-size="11.5" font-weight="normal" fill="#5d676e">grading design</text><rect x="822" y="527.0" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="536.0" font-size="11">building, office pods, dock doors</text><rect x="822" y="543.0" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="552.0" font-size="11">truck court</text><rect x="822" y="559.0" width="18" height="10" fill="#bfc5ca" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="568.0" font-size="11">truck roads and truck route</text><rect x="822" y="575.0" width="18" height="10" fill="#a7adb3" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="584.0" font-size="11">trailer stalls / drop yard</text><rect x="822" y="591.0" width="18" height="10" fill="#dfe3f1" stroke="#1f2a30" stroke-width="0.6
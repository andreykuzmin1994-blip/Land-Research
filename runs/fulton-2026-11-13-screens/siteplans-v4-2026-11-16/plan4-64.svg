A 3; 10 x 18 ft)</text><text x="822" y="152" font-size="11.5" font-weight="normal" fill="#1f2a30">Site 11.8 ac (county map)   9,000 SF/gross ac   FAR 0.21</text><text x="822" y="167" font-size="11.5" font-weight="normal" fill="#1f2a30">Impervious 6.4 ac (54%)</text><text x="822" y="182" font-size="11.5" font-weight="normal" fill="#1f2a30">Detention 2.4 ac-ft in 1 pond(s)</text><text x="822" y="198" font-size="11.5" font-weight="normal" fill="#1f2a30">Access: truck (T) + car (C); local road, GDOT route 1121200062000;</text><text x="822" y="214" font-size="11.5" font-weight="normal" fill="#1f2a30">frontage 1,484 ft</text><text x="822" y="229" font-size="11.5" font-weight="normal" fill="#1f2a30">Graded area: relief ~10 ft, balanced cut/fill ~10,000 CY, steep 0%</text><text x="822" y="246" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="262" font-size="11.5" font-weight="normal" fill="#8a5a00">! COLLECTOR_FRONTAGE: Fairburn M-districts require collector-</text><text x="822" y="277" font-size="11.5" font-weight="normal" fill="#8a5a00">street frontage; this frontage reads as a local road</text><text x="822" y="292" font-size="11.5" font-weight="normal" fill="#8a5a00">! TRAILER_SHORT: 0 trailer stalls against a target of 11</text><text x="822" y="308" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="324" font-size="11.5" font-weight="normal" fill="#8a5a00">for fairburn; zoning_rules.json is the authority</text><text x="822" y="339" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="354" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="370" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 8,990 SF per gross acre; Georgia comps run</text><text x="822" y="386" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="401" font-size="11.5" font-weight="normal" fill="#5d676e">i IMPERVIOUS_RATIO: impervious / building footprint 2.6 (comps</text><text x="822" y="416" font-size="11.5" font-weight="normal" fill="#5d676e">about 2.0-2.1)</text><text x="822" y="432" font-size="11.5" font-weight="normal" fill="#5d676e">i POND_SITE_FROM_LIDAR: pond placed low, near the module and on</text><text x="822" y="448" font-size="11.5" font-weight="normal" fill="#5d676e">its side of mapped wetlands; no outfall, maintenance drive or</text><text x="822" y="463" font-size="11.5" font-weight="normal" fill="#5d676e">grading design</text><rect x="822" y="477.0" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="486.0" font-size="11">building, office pods, dock doors</text><rect x="822" y="493.0" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="502.0" font-size="11">truck court</text><rect x="822" y="509.0" width="18" height="10" fill="#bfc5ca" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="518.0" font-size="11">truck roads and truck route</text><rect x="822" y="525.0" width="18" height="10" fill="#a7adb3" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="534.0" font-size="11">trailer stalls / drop yard</text><rect x="822" y="541.0" width="18" height="10" fill="#dfe3f1" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="550.0" font-size="11">car parking and car route</text><rect x="822" y="557.0" width="18" height="10" fill="#8ccfc4" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="566.0" font-size="11">detention pond (rim around)</text><rect x="822" y="573.0" width="18" height="10" fill="#9cc3e0" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="582.0" font-size="11">floodplain, wetlands, easements, protected</text><rect x="822" y="589.0" width="18" height="10" fill="url(#tx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="598.0" font-size="11">transmission corridor (assumed width)</text><rect x="822" y="605.0" width="18" height="10" fill="url(#sx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="614.0" font-size="11">steeper than 15% (lidar)</text><rect x="822" y="621.0" width="18" height="10" fill="url(#cx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="630.0" font-size="11">test cut</text><path d="M822,642.0 L840,642.0" stroke="#7a8a94" stroke-dasharray="6 4" stroke-width="1.5"/><text x="848" y="646.0" font-size="11">paving envelope (draft setbacks/buffers, 25 ft from water)</text><rect x="822" y="653.0" width="18" height="10" fill="#d9480f" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="662.0" font-size="11">GDOT road frontage; T/C driveways</text><text x="822" y="683" font-size="10.5" fill="#5d676e">Screening test fit from public data: not a survey, civil design or zoning</text><text x="822" y="696" font-size="10.5" fill="#5d676e">determination. Zoning values are draft; detention is a +/-30% estimate;</text><text x="822" y="709" font-size="10.5" fill="#5d676e">routes, fire access and grading are indicative.</text></svg>
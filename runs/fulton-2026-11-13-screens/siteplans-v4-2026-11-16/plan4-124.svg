,672.2 L35.0,157.3 L71.1,156.8" stroke="#d9480f" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="35.8" cy="328.2" r="9" fill="#d9480f"/><text x="35.8" y="332.2" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">T</text><path d="M771.2,661.7 L771.2,661.8 L771.2,661.9 L771.2,662.0 L771.1,662.1 L771.1,662.3 L771.0,662.4 L770.9,662.5 L770.8,662.5 L770.7,662.6 L770.6,662.7 L770.5,662.8 L770.4,662.8 L770.3,662.9 L770.2,662.9 L770.1,662.9 L769.9,662.9 L38.6,672.2 L38.5,672.1 L38.3,672.1 L38.2,672.1 L38.1,672.1 L38.0,672.0 L37.9,671.9 L37.8,671.9 L37.7,671.8 L37.6,671.7 L37.5,671.6 L37.4,671.5 L37.4,671.4 L37.3,671.2 L37.3,671.1 L37.3,671.0 L37.3,670.9 L35.0,158.6 L35.0,158.5 L35.0,158.3 L35.1,158.2 L35.1,158.1 L35.1,158.0 L35.2,157.9 L35.3,157.8 L35.4,157.7 L35.5,157.6 L35.6,157.5 L35.7,157.4 L35.8,157.4 L35.9,157.3 L36.0,157.3 L36.1,157.3 L36.3,157.3 L783.7,147.8 L783.8,147.9 L784.0,147.9 L784.1,147.9 L784.2,147.9 L784.3,148.0 L784.4,148.1 L784.5,148.1 L784.6,148.2 L784.7,148.3 L784.8,148.4 L784.9,148.5 L784.9,148.7 L785.0,148.8 L785.0,148.9 L785.0,149.0 L785.0,149.2 Z" fill="none" fill-opacity="1.0" stroke="#1f2a30" stroke-width="1.6" fill-rule="evenodd" /><text x="381.6" y="515.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2a30">42,000 SF</text><path d="M780,30 L788,56 L780,50 L772,56 Z" fill="#1f2a30"/><text x="780" y="70" font-size="12" text-anchor="middle" font-weight="bold">N</text><path d="M20,808 L149.1,808" stroke="#1f2a30" stroke-width="3"/><text x="155.1" y="812" font-size="11">100 ft</text><text x="822" y="43" font-size="15" font-weight="bold" fill="#1f2a30">NOT FEASIBLE (see !! flags). #124 0 CAMPBELL DR,</text><text x="822" y="62" font-size="15" font-weight="bold" fill="#1f2a30">South Fulton / unincorporated (5.0 ac tax roll)</text><text x="822" y="78" font-size="11.5" font-weight="normal" fill="#1f2a30">rear-load 160 deep, court + trailer row, cars at office end</text><text x="822" y="93" font-size="11.5" font-weight="normal" fill="#1f2a30">(market depth, not an operator prototype)</text><text x="822" y="108" font-size="11.5" font-weight="bold" fill="#1f2a30">42,000 SF   260 x 160 ft   32 ft clear (assumed)</text><text x="822" y="124" font-size="11.5" font-weight="normal" fill="#1f2a30">Dock doors 8   office ~1,000 SF</text><text x="822" y="140" font-size="11.5" font-weight="normal" fill="#1f2a30">Trailer stalls 4 (court rows 4, drop yard 0) vs target 4</text><text x="822" y="155" font-size="11.5" font-weight="normal" fill="#1f2a30">Car stalls 45 (required 42; ADA 2; 9 x 18 ft)</text><text x="822" y="170" font-size="11.5" font-weight="normal" fill="#1f2a30">Site 5.3 ac (county map)   7,900 SF/gross ac   FAR 0.18</text><text x="822" y="186" font-size="11.5" font-weight="normal" fill="#1f2a30">Impervious 3.6 ac (68%)</text><text x="822" y="202" font-size="11.5" font-weight="normal" fill="#1f2a30">Detention 1.3 ac-ft in 0 pond(s) - see flags</text><text x="822" y="217" font-size="11.5" font-weight="normal" fill="#1f2a30">Access: truck (T); local road, GDOT route 1121200162300; frontage</text><text x="822" y="232" font-size="11.5" font-weight="normal" fill="#1f2a30">456 ft</text><text x="822" y="248" font-size="11.5" font-weight="normal" fill="#1f2a30">Graded area: relief ~23 ft, balanced cut/fill ~9,000 CY, steep 1%</text><text x="822" y="265" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="280" font-size="11.5" font-weight="normal" fill="#8a5a00">! RESIDENTIAL_EDGE: about 438 ft of boundary touches residential</text><text x="822" y="296" font-size="11.5" font-weight="normal" fill="#8a5a00">parcels (county land-use codes); draft buffers applied</text><text x="822" y="312" font-size="11.5" font-weight="normal" fill="#8a5a00">! ACCESS_SHARED: one driveway: cars split from trucks inside the</text><text x="822" y="327" font-size="11.5" font-weight="normal" fill="#8a5a00">throat</text><text x="822" y="342" font-size="11.5" font-weight="normal" fill="#8a5a00">! SHORT_THROAT: truck throat about 57 ft from the street to the</text><text x="822" y="358" font-size="11.5" font-weight="normal" fill="#8a5a00">court (100 ft wanted for stacking)</text><text x="822" y="374" font-size="11.5" font-weight="normal" fill="#8a5a00">! FIRE_SECOND_ACCESS: 1 driveway(s): a second fire access</text><text x="822" y="389" font-size="11.5" font-weight="normal" fill="#8a5a00">(emergency-only link) or fire-official approval needed</text><text x="822" y="404" font-size="11.5" font-weight="normal" fill="#8a5a00">! POND_DOES_NOT_FIT: 1 pond(s) of 1.3 ac-ft do not fit on the</text><text x="822" y="420" font-size="11.5" font-weight="normal" fill="#8a5a00">development side: underground detention (vaults) or a smaller</text><text x="822" y="436" font-size="11.5" font-weight="normal" fill="#8a5a00">building</text><text x="822" y="451" font-size="11.5" font-weight="normal" fill="#8a5a00">! LOADING_FACES_RES: a truck court or trailer row is within 150 ft</text><text x="822" y="466" font-size="11.5" font-weight="normal" fill="#8a5a00">of a residential edge (50 ft loading strip and screening likely)</text><text x="822" y="482" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREET_FACING_DOCKS: a truck court faces the street within 100</text><text x="822" y="498" font-size="11.5" font-weight="normal" fill="#8a5a00">ft (screening; some codes forbid it)</text><text x="822" y="513" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="528" font-size="11.5" font-weight="normal" fill="#8a5a00">for south fulton; zoning_rules.json is the authority</text><text x="822" y="544" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="560" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="575" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 7,906 SF per gross acre; Georgia comps run</text><text x="822" y="590" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="606" font-size="11.5" font-weight="normal" fill="#5d676e">i LD_OUT_OF_BAND: length/depth 1.6 (comps 2.0-3.8)</text><text x="822" y="622" font-size="11.5" font-weight="normal" fill="#5d676e">i IMPERVIOUS_RATIO: impervious / building footprint 3.7 (comps</text><text x="822" y="637" font-size="11.5" font-weight="normal" fill="#5d676e">about 2.0-2.1)</text><rect x="822" y="651.0" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="660.0" font-size="11">building, office pods, dock doors</text><rect x="822" y="667.0" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="676.0" font-size="11">truck court</text><rect x="822" y="683.0" width="18" height="10" fill="#bfc5ca" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="692.0" font-size="11">truck roads and truck route</text><rect x="822" y="699.0" width="18" height="10" fill="#a7adb3" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="708.0" font-size="11">trailer stalls / drop yard</text><rect x="822" y="715.0" width="18" height="10" fill="#dfe3f1" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="724.0" font-size="11">car parking and car route</text><rect x="822" y="731.0" width="18" height="10" fill="#8ccfc4" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="740.0" font-size="11">detention pond (rim around)</text><rect x="822" y="747.0" width="18" height="10" fill="#9cc3e0" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="756.0" font-size="11">floodplain, wetlands, easements, protected</text><rect x="822" y="763.0" width="18" height="10" fill="url(#tx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="772.0" font-size="11">transmission corridor (assumed width)</text><rect x="822" y="779.0" width="18" height="10" fill="url(#sx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="788.0" font-size="11">steeper than 15% (lidar)</text><rect x="822" y="795.0" width="18" height="10" fill="url(#cx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="804.0" font-size="11">test cut</text><path d="M822,816.0 L840,816.0" stroke="#7a8a94" stroke-dasharray="6 4" stroke-width="1.5"/><text x="848" y="820.0" font-size="11">paving envelope (draft setbacks/buffers, 25 ft from water)</text><rect x="822" y="827.0" width="18" height="10" fill="#d9480f" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="836.0" font-size="11">GDOT road frontage; T/C driveways</text><text x="822" y="857" font-size="10.5" fill="#5d676e">Screening test fit from public data: not a survey, civil design or zoning</text><text x="822" y="870" font-size="10.5" fill="#5d676e">determination. Zoning values are draft; detention is a +/-30% estimate;</text><text x="822" y="883" font-size="10.5" fill="#5d676e">routes, fire access and grading are indicative.</text></svg>
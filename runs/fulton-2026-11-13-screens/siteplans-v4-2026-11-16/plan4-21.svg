ight="normal" fill="#1f2a30">Site 8.7 ac (county map)   7,900 SF/gross ac   FAR 0.18</text><text x="822" y="167" font-size="11.5" font-weight="normal" fill="#1f2a30">Impervious 4.8 ac (55%)</text><text x="822" y="182" font-size="11.5" font-weight="normal" fill="#1f2a30">Detention 1.8 ac-ft in 1 pond(s)</text><text x="822" y="198" font-size="11.5" font-weight="normal" fill="#1f2a30">Access: truck (T) + car (C); local road, GDOT route 1121200311803;</text><text x="822" y="214" font-size="11.5" font-weight="normal" fill="#1f2a30">frontage 720 ft</text><text x="822" y="229" font-size="11.5" font-weight="normal" fill="#1f2a30">Graded area: relief ~38 ft, balanced cut/fill ~27,000 CY, steep 1%</text><text x="822" y="246" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="262" font-size="11.5" font-weight="normal" fill="#8a5a00">! RESIDENTIAL_EDGE: about 346 ft of boundary touches residential</text><text x="822" y="277" font-size="11.5" font-weight="normal" fill="#8a5a00">parcels (county land-use codes); draft buffers applied</text><text x="822" y="292" font-size="11.5" font-weight="normal" fill="#8a5a00">! ATL_PARKING_CODE: parking at the market ratio; Atlanta's 1/600</text><text x="822" y="308" font-size="11.5" font-weight="normal" fill="#8a5a00">SF code minimum (unverified after the parking reforms) would need</text><text x="822" y="324" font-size="11.5" font-weight="normal" fill="#8a5a00">far more</text><text x="822" y="339" font-size="11.5" font-weight="normal" fill="#8a5a00">! TRAILER_SHORT: 0 trailer stalls against a target of 7</text><text x="822" y="354" font-size="11.5" font-weight="normal" fill="#8a5a00">! LOADING_FACES_RES: a truck court or trailer row is within 150 ft</text><text x="822" y="370" font-size="11.5" font-weight="normal" fill="#8a5a00">of a residential edge (50 ft loading strip and screening likely)</text><text x="822" y="386" font-size="11.5" font-weight="normal" fill="#8a5a00">! RELIEF: about 38 ft of relief across the graded area: terraces</text><text x="822" y="401" font-size="11.5" font-weight="normal" fill="#8a5a00">or retaining walls likely</text><text x="822" y="416" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="432" font-size="11.5" font-weight="normal" fill="#8a5a00">for atlanta; zoning_rules.json is the authority</text><text x="822" y="448" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="463" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="478" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 7,864 SF per gross acre; Georgia comps run</text><text x="822" y="494" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="510" font-size="11.5" font-weight="normal" fill="#5d676e">i LD_OUT_OF_BAND: length/depth 1.9 (comps 2.0-3.8)</text><text x="822" y="525" font-size="11.5" font-weight="normal" fill="#5d676e">i IMPERVIOUS_RATIO: impervious / building footprint 3.0 (comps</text><text x="822" y="540" font-size="11.5" font-weight="normal" fill="#5d676e">about 2.0-2.1)</text><text x="822" y="556" font-size="11.5" font-weight="normal" fill="#5d676e">i POND_SITE_FROM_LIDAR: pond placed low, near the module and on</text><text x="822" y="572" font-size="11.5" font-weight="normal" fill="#5d676e">its side of mapped wetlands; no outfall, maintenance drive or</text><text x="822" y="587" font-size="11.5" font-weight="normal" fill="#5d676e">grading design</text><rect x="822" y="601.0" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="610.0" font-size="11">building, office pods, dock doors</text><rect x="822" y="617.0" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="626.
" font-weight="normal" fill="#1f2a30">Car stalls 155 (required 152; ADA 6; 9 x 18 ft)</text><text x="822" y="170" font-size="11.5" font-weight="normal" fill="#1f2a30">Site 21.8 ac (county map)   9,900 SF/gross ac   FAR 0.23</text><text x="822" y="186" font-size="11.5" font-weight="normal" fill="#1f2a30">Impervious 11.1 ac (51%)</text><text x="822" y="202" font-size="11.5" font-weight="normal" fill="#1f2a30">Detention 4.2 ac-ft in 1 pond(s)</text><text x="822" y="217" font-size="11.5" font-weight="normal" fill="#1f2a30">Access: truck (T) + car (C); local road, GDOT route 1121200060700;</text><text x="822" y="232" font-size="11.5" font-weight="normal" fill="#1f2a30">frontage 1,107 ft</text><text x="822" y="248" font-size="11.5" font-weight="normal" fill="#1f2a30">Graded area: relief ~27 ft, balanced cut/fill ~41,000 CY, steep 2%</text><text x="822" y="265" font-size="13" font-weight="bold" fill="#1f2a30">Flags</text><text x="822" y="280" font-size="11.5" font-weight="normal" fill="#8a5a00">! SHORT_THROAT: truck throat about 32 ft from the street to the</text><text x="822" y="296" font-size="11.5" font-weight="normal" fill="#8a5a00">court (100 ft wanted for stacking)</text><text x="822" y="312" font-size="11.5" font-weight="normal" fill="#8a5a00">! FIRE_SECOND_ACCESS: driveways 335 ft apart, under half the</text><text x="822" y="327" font-size="11.5" font-weight="normal" fill="#8a5a00">building diagonal (422 ft)</text><text x="822" y="342" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREET_FACING_DOCKS: a truck court faces the street within 100</text><text x="822" y="358" font-size="11.5" font-weight="normal" fill="#8a5a00">ft (screening; some codes forbid it)</text><text x="822" y="374" font-size="11.5" font-weight="normal" fill="#8a5a00">! RELIEF: about 27 ft of relief across the graded area: terraces</text><text x="822" y="389" font-size="11.5" font-weight="normal" fill="#8a5a00">or retaining walls likely</text><text x="822" y="404" font-size="11.5" font-weight="normal" fill="#8a5a00">! ZONING_DRAFT: setbacks and buffers are draft screening values</text><text x="822" y="420" font-size="11.5" font-weight="normal" fill="#8a5a00">for south fulton; zoning_rules.json is the authority</text><text x="822" y="436" font-size="11.5" font-weight="normal" fill="#8a5a00">! STREAMS_PIPELINES: stream lines and petroleum pipelines are not</text><text x="822" y="451" font-size="11.5" font-weight="normal" fill="#8a5a00">mapped; mapped water, wetlands and floodplain get a 25 ft buffer</text><text x="822" y="466" font-size="11.5" font-weight="normal" fill="#5d676e">i BELOW_COMP_BAND: 9,897 SF per gross acre; Georgia comps run</text><text x="822" y="482" font-size="11.5" font-weight="normal" fill="#5d676e">about 10,500-15,400</text><text x="822" y="498" font-size="11.5" font-weight="normal" fill="#5d676e">i POND_SITE_FROM_LIDAR: pond placed low, near the module and on</text><text x="822" y="513" font-size="11.5" font-weight="normal" fill="#5d676e">its side of mapped wetlands; no outfall, maintenance drive or</text><text x="822" y="528" font-size="11.5" font-weight="normal" fill="#5d676e">grading design</text><rect x="822" y="542.5" width="18" height="10" fill="#e9e4da" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="551.5" font-size="11">building, office pods, dock doors</text><rect x="822" y="558.5" width="18" height="10" fill="#c4c9cd" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="567.5" font-size="11">truck court</text><rect x="822" y="574.5" width="18" height="10" fill="#bfc5ca" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="583.5" font-size="11">truck roads and truck route</text><rect x="822" y="590.5" width="18" height="10" fill="#a7adb3" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="599.5" font-size="11">trailer stalls / drop yard</text><rect x="822" y="606.5" width="18" height="10" fill="#dfe3f1" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="615.5" font-size="11">car parking and car route</text><rect x="822" y="622.5" width="18" height="10" fill="#8ccfc4" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="631.5" font-size="11">detention pond (rim around)</text><rect x="822" y="638.5" width="18" height="10" fill="#9cc3e0" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="647.5" font-size="11">floodplain, wetlands, easements, protected</text><rect x="822" y="654.5" width="18" height="10" fill="url(#tx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="663.5" font-size="11">transmission corridor (assumed width)</text><rect x="822" y="670.5" width="18" height="10" fill="url(#sx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="679.5" font-size="11">steeper than 15% (lidar)</text><rect x="822" y="686.5" width="18" height="10" fill="url(#cx)" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="695.5" font-size="11">test cut</text><path d="M822,707.5 L840,707.5" stroke="#7a8a94" stroke-dasharray="6 4" stroke-width="1.5"/><text x="848" y="711.5" font-size="11">paving envelope (draft setbacks/buffers, 25 ft from water)</text><rect x="822" y="718.5" width="18" height="10" fill="#d9480f" stroke="#1f2a30" stroke-width="0.6"/><text x="848" y="727.5" font-size="11">GDOT road frontage; T/C driveways</text><text x="822" y="748" font-size="10.5" fill="#5d676e">Screening test fit from public data: not a survey, civil design or zoning</text><text x="822" y="762" font-size="10.5" fill="#5d676e">determination. Zoning values are draft; detention is a +/-30% estimate;</text><text x="822" y="774" font-size="10.5" fill="#5d676e">routes, fire access and grading are indicative.</text></svg>
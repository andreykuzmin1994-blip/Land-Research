name: Offline test suite

# The full offline suite (FakeConnection-driven, no network, no secrets,
# ~1s wall clock) on EVERY push and pull request, unconditionally.
#
# The other workflows are path-filtered and collectively leave gaps:
# cli.py appeared in no filter at all, and a runner.py change ran only
# tests.test_discovery. Tier 0 of the review model (STANDING_RISKS.md
# § Change tiers: "tests + CI only") assumes CI always runs the tests —
# this workflow is what makes that assumption true. The suite is cheap
# enough that path-filtering it would save nothing.
#
# The separate screener/ tool has its own offline suite and requirements
# (shapely); it runs as its own step so a failure names the suite. So do
# the unattended-run tools in ops/screener/.

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    # The screener suite alone now takes about five minutes: at the old
    # limit of 5 the job was cancelled before it could report (the runs on
    # main after pull requests 49 and 50 were).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r screener/requirements.txt

      - name: Run the full offline suite
        run: python -m unittest discover -s tests -v

      - name: Run the screener offline suite
        run: python -m unittest discover -s screener/tests -t . -v

      # ops/screener: the unattended-run tools. Offline (fake screener, fake
      # agents, a throwaway git repository); the lead-check test needs
      # nothing installed beyond bash, git and python.
      - name: Run the ops/screener offline tests
        run: |
          python -m unittest discover -s ops/screener -p 'test_*.py' -v
          bash ops/screener/test_supervise.sh
          bash ops/screener/test_investigate.sh
          bash ops/screener/test_agenda.sh

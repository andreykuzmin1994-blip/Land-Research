name: Discovery — Fulton live PostGIS smoke test

# Phase 3.1 §10.5 / §6.1: the offline test suite uses FakeConnection and
# never executes SQL. This workflow spins up a postgres+postgis service
# container, applies the schema via prepare.apply_schema, and runs a
# single happy-path UPSERT through research._process_parcel against the
# live DB. Asserts ST_IsValid, ST_Within, and the absence of the
# deprecated '(none)' parcel_id sentinel in flagged_items.
#
# Triggered on changes to research.py, prepare.py, the storage spec, the
# discovery test suite, the smoke script itself, or this workflow.

on:
  push:
    paths:
      - 'research.py'
      - 'runner.py'
      - 'costar_ingest.py'
      - 'reporting.py'
      - 'pipeline_common.py'
      - 'prepare.py'
      - 'STORAGE_ARCHITECTURE.md'
      - 'tests/test_discovery.py'
      - 'tests/test_postgis_smoke.py'
      - 'tests/live_txn_check.py'
      - 'tests/live_submarket_check.py'
      - 'costar_import.py'
      - 'zoning.py'
      - 'zoning_import.py'
      - 'zoning_rules.json'
      - 'tests/live_zoning_check.py'
      - 'site_fit.py'
      - 'building_prototypes.json'
      - 'tests/live_site_fit_check.py'
      - 'hazards.py'
      - 'hazards_import.py'
      - 'tests/live_hazards_check.py'
      - 'tests/fixtures/discovery/**'
      - 'requirements.txt'
      - '.github/workflows/discovery-fulton.yml'
  pull_request:
    paths:
      - 'research.py'
      - 'runner.py'
      - 'costar_ingest.py'
      - 'reporting.py'
      - 'pipeline_common.py'
      - 'prepare.py'
      - 'STORAGE_ARCHITECTURE.md'
      - 'tests/test_discovery.py'
      - 'tests/test_postgis_smoke.py'
      - 'tests/live_txn_check.py'
      - 'tests/live_submarket_check.py'
      - 'costar_import.py'
      - 'zoning.py'
      - 'zoning_import.py'
      - 'zoning_rules.json'
      - 'tests/live_zoning_check.py'
      - 'site_fit.py'
      - 'building_prototypes.json'
      - 'tests/live_site_fit_check.py'
      - 'hazards.py'
      - 'hazards_import.py'
      - 'tests/live_hazards_check.py'
      - 'tests/fixtures/discovery/**'
      - 'requirements.txt'
      - '.github/workflows/discovery-fulton.yml'

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Offline discovery tests
        run: python -m unittest tests.test_discovery -v

  live-postgis:
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: lr
          POSTGRES_PASSWORD: lr_pw
          POSTGRES_DB: lr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lr -d lr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lr:lr_pw@localhost:5432/lr_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for postgis service
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U lr -d lr_test; then
              echo "postgis is ready"; exit 0
            fi
            sleep 2
          done
          echo "::error ::postgis service did not become ready in 60s"
          exit 1

      - name: Run live-PostGIS smoke test
        run: python tests/test_postgis_smoke.py

      # After the smoke test, which applies the schema this check uses.
      # Neither depends on the checked-out branch (a pushed
      # autoresearch/<tag> branch is checked out by name): each reads and
      # writes under an explicit run tag of its own (smoke-<hex>,
      # livetxn-<hex>). This check deletes every row it writes.
      - name: Run live transaction-integrity check
        run: python tests/live_txn_check.py

      # reviews/19_costar_import: the read-time submarket resolver and the
      # CoStar area writer against real PostGIS. Own market, cleans up.
      - name: Run live submarket resolution check
        run: python tests/live_submarket_check.py

      # reviews/21_zoning: the S9 precedent SQL (metres, self-match, index)
      # and zoning_import's PostGIS overlay + UPDATE against real PostGIS.
      # No network. Own database, created and dropped by the check.
      - name: Run live zoning check
        run: python tests/live_zoning_check.py

      # reviews/22_site_fit: site_fit's inward buffer (SRID 2240 feet),
      # degenerate geometry, savepoint recovery, ST_Covers of every placement
      # and the SiteFit export. No network. Own database, created and dropped.
      - name: Run live site-fit check
        run: python tests/live_site_fit_check.py

      # reviews/26_flood_wetlands: the proposed parcel_hazards DDL (own
      # database only), the shapefile import's PostGIS areas (SRID 2240),
      # rings, overlaps, LOMR, noise floor, idempotency, the site-fit
      # deduction and the scoring read. No network. Created and dropped.
      - name: Run live hazards check
        run: python tests/live_hazards_check.py

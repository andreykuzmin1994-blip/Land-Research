name: Connector harness — Fulton

# Validates the Fulton County connector against the live ArcGIS endpoint on
# every push or PR that touches the harness, the connector registry, or
# sources.json. No Postgres needed (the harness is DB-independent by design).
#
# R-12 distinguishes transport / logic failures. The verdict is keyed on the
# report's top-level failure_class (taxonomy in the connector_harness.py
# docstring), never on the exit code alone; the exit code is cross-checked
# against overall_health:
#   exit 0 and overall_health healthy                 -> pass
#   failure_class transport (exit 2 or 3)             -> warning, pass
#   failure_class logic (exit 2 or 3)                 -> error, fail
#   exit 124 (the timeout fired) and no report        -> warning, pass
#   exit 1 (config error or a not-configured n_a),
#   any other exit code, a missing or unparseable
#   report, a missing or unknown failure_class, or an
#   exit code that disagrees with overall_health      -> error, fail
# transport = connection error other than TLS, timeout, or HTTP 5xx after
# retries; everything else (ArcGIS error envelopes, HTTP 4xx, bad URLs, TLS,
# schema drift, crashes) is logic. Residual risk: a DNS typo looks like a
# transient DNS failure and only warns (research._harness_gate still fails
# closed at runtime).
#
# R-17 concurrency group: at most one harness run at a time across all branches
# to avoid hammering the Fulton GIS endpoint when multiple PRs land at once.

on:
  push:
    paths:
      - 'connector_harness.py'
      - 'connector_registry.json'
      - 'sources.json'
      - 'tests/test_harness.py'
      - 'tests/test_harness_health.py'
      - 'requirements.txt'
      - '.github/workflows/harness-fulton.yml'
  pull_request:
    paths:
      - 'connector_harness.py'
      - 'connector_registry.json'
      - 'sources.json'
      - 'tests/test_harness.py'
      - 'tests/test_harness_health.py'
      - 'requirements.txt'
      - '.github/workflows/harness-fulton.yml'

concurrency:
  group: harness-fulton-live
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v

  live-fulton:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run harness against Fulton (quick mode)
        id: harness
        continue-on-error: true
        run: |
          # Record the exit code for EVERY outcome: under the default `bash -e`
          # a bare non-zero command ends the step before a following echo
          # runs. `timeout` keeps a stalled server inside the job budget
          # (exit 124, no report written).
          rc=0
          timeout 180 python connector_harness.py --county fulton --quick || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report-fulton
          path: harness_reports/fulton*.json
          if-no-files-found: warn

      - name: Distinguish transport vs logic failure
        env:
          HARNESS_EC: ${{ steps.harness.outputs.exit_code }}
        run: |
          # Decision matrix in the header comment. Exit codes from
          # connector_harness.py: 0 healthy, 2 failing, 3 degraded,
          # 1 config error (incl. a not-configured connector), 124 timeout.
          # Report text (server messages) is printed between stop-commands
          # markers so it cannot inject workflow commands.
          python - <<'PY'
          import glob, json, os, re, secrets, sys

          ec = os.environ.get("HARNESS_EC", "")
          paths = sorted(glob.glob("harness_reports/fulton*.json"), key=os.path.getmtime)


          def verdict(level, message, report=None):
              if isinstance(report, dict):
                  checks = report.get("checks")
                  checks = checks if isinstance(checks, dict) else {}
                  summary = {
                      "overall_health": report.get("overall_health"),
                      "failure_class": report.get("failure_class", "<missing>"),
                      "failed_checks": {
                          name: {k: c[k] for k in ("failure_class", "http_code", "error",
                                                   "reason", "crash") if k in c}
                          for name, c in checks.items()
                          if isinstance(c, dict) and c.get("status") == "fail"
                      },
                      "errors": report.get("errors"),
                  }
                  token = secrets.token_hex(16)
                  print(f"::stop-commands::{token}")
                  print(json.dumps(summary, indent=2, sort_keys=True))
                  print(f"::{token}::")
              print(message if level == "ok" else f"::{level} ::{message}")
              sys.exit(1 if level == "error" else 0)


          if not re.fullmatch(r"[0-9]{1,3}", ec):
              verdict("error", f"Harness exit code was not captured ({ec!r}).")
          ec = int(ec)
          if not paths:
              if ec == 124:
                  verdict("warning", "Harness timed out before writing a report (transport, R-12).")
              verdict("error", f"No harness report produced (exit {ec}); crashed or misconfigured.")
          try:
              with open(paths[-1], encoding="utf-8") as fh:
                  report = json.load(fh)
          except (OSError, ValueError) as exc:
              verdict("error", f"Unreadable harness report: {exc.__class__.__name__}.")
          if not isinstance(report, dict) or "failure_class" not in report:
              verdict("error", "Harness report has no failure_class; cannot classify.", report)
          health, fclass = report.get("overall_health"), report["failure_class"]
          expected = {0: "healthy", 2: "failing", 3: "degraded"}.get(ec)
          if expected is None:
              verdict("error", f"Harness exit {ec} is not a verdict (1 = config error "
                               "or connector not configured, 124 = timed out).", report)
          if health != expected:
              verdict("error", f"Harness exit {ec} disagrees with "
                               f"overall_health={health!r}.", report)
          if ec == 0:
              if fclass is None:
                  verdict("ok", "Harness healthy.", report)
              verdict("error", f"Healthy report carries failure_class={fclass!r}.", report)
          if fclass == "transport":
              verdict("warning", f"Transient network/transport failure against Fulton ArcGIS "
                                 f"(overall_health={health}).", report)
          if fclass == "logic":
              verdict("error", f"Harness reports a logic-level failure against Fulton "
                               f"(overall_health={health}).", report)
          verdict("error", f"Unknown failure_class {fclass!r}.", report)
          PY

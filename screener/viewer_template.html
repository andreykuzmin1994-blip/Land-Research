<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="__CSP__"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Site Plan Viewer</title>
<style>
:root{--bg:#f4f3ef;--panel:#fff;--ink:#1d2327;--mute:#5d676e;--line:#d9d6cd;--accent:#2b6cb0;--sel:#e8f0fa;
--open:#2f6f4f;--unchecked:#3f5f86;--doubt:#a86a00;--taken:#b3402f;--drop:#8a2d22;--listed:#6b5b95;--test:#6b4fa0;--plan:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181a;--panel:#1e2225;--ink:#e6e3dc;--mute:#9aa3a9;--line:#33393d;--sel:#23324a;--accent:#7fb0e6}}
:root[data-theme="dark"]{--bg:#15181a;--panel:#1e2225;--ink:#e6e3dc;--mute:#9aa3a9;--line:#33393d;--sel:#23324a;--accent:#7fb0e6}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.head{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 2px}.sub{color:var(--mute);font-size:12.5px}
.controls{display:grid;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.controls input,.controls select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:default}
.count{font-size:12.5px;color:var(--mute)}.count button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
#list{overflow:auto;flex:1;min-height:0;padding:6px}
.item{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:6px;border-radius:8px;cursor:pointer;border:1px solid transparent;width:100%;text-align:left;background:none;color:inherit}
.item:hover{background:var(--sel)}.item[aria-current=true]{background:var(--sel);border-color:var(--accent)}
.thumb{width:64px;height:64px;border:1px solid var(--line);border-radius:4px;background:var(--plan);overflow:hidden}
.thumb svg{width:100%;height:auto;display:block}
.it-t{font-weight:600;font-size:13.5px;line-height:1.25}.it-s{color:var(--mute);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.s-open{background:var(--open)}.s-unchecked{background:var(--unchecked)}.s-doubt{background:var(--doubt)}.s-taken{background:var(--taken)}.s-drop{background:var(--drop)}.s-listed{background:var(--listed)}
.draft{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:0 6px;border-radius:4px;background:#a86a00;color:#fff}
.tag{font-size:11px;font-weight:600;padding:0 6px;border-radius:999px;background:var(--test);color:#fff;margin-left:4px}
main{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar button,.bar a.btn,.bar select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;text-decoration:none}
.bar a.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
#cmpsel{width:auto;max-width:320px;flex:0 1 320px}
.bar label{font-size:13px;display:flex;gap:4px;align-items:center}
.bar .sp{flex:1}
.stage{display:grid;grid-template-columns:1fr minmax(360px,34%);min-height:0}
.stage.cmp{grid-template-columns:1fr 1fr}
.view{position:relative;overflow:hidden;background:var(--bg);touch-action:none;min-height:0}
.view .canvas{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--plan);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.view .canvas svg{display:block}
.vlabel{position:absolute;left:8px;top:8px;right:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;z-index:2}
.vlabel .mini{color:var(--mute)}
.scalenote{position:absolute;left:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;z-index:2}
.facts{overflow:auto;padding:12px 14px;border-left:1px solid var(--line);background:var(--panel)}
.facts h2{font-size:17px;margin:0 0 2px}.facts .place{color:var(--mute);margin-bottom:8px}
.badge{display:inline-block;font-size:12px;font-weight:600;color:#fff;border-radius:999px;padding:1px 9px;margin:0 4px 6px 0}
[hidden]{display:none!important}
dl{display:grid;grid-template-columns:minmax(6em,9.5em) 1fr;gap:3px 10px;margin:8px 0;font-size:13.5px}dt{color:var(--mute)}dd{margin:0;overflow-wrap:anywhere}
.note{font-size:13px;background:var(--bg);border-radius:6px;padding:8px 10px;margin:8px 0;overflow-wrap:anywhere}
.lbl{color:var(--mute);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0}td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}
.empty{padding:30px;color:var(--mute)}
.verdict{border-left:4px solid var(--mute);background:var(--bg);border-radius:0 6px 6px 0;padding:8px 10px;margin:6px 0 10px;font-size:13.5px;font-weight:600}
.facts h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 0 4px;border-bottom:1px solid var(--line);padding-bottom:3px}
ol.steps{margin:6px 0;padding-left:20px;font-size:13px}ol.steps li{margin:0 0 7px}ol.steps .lead{font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.ok{color:var(--open);font-weight:600}.bad{color:var(--drop);font-weight:600}.warn{color:var(--doubt);font-weight:600}
.cond{border-left:3px solid var(--line);padding:2px 0 2px 8px;margin:0 0 9px;font-size:13px}.cond.k-blocking{border-color:var(--drop)}.cond.k-gate,.cond.k-site{border-color:var(--doubt)}
.cond .code{font-size:11.5px;color:var(--mute);overflow-wrap:anywhere}
details{margin:10px 0;font-size:13px}summary{cursor:pointer;color:var(--accent)}
.facts button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
@media (max-width:860px){.app{grid-template-columns:1fr;height:auto}aside{max-height:46vh}main{min-height:80vh}.stage,.stage.cmp{grid-template-columns:1fr}.view{height:55vh}.view.fitted{touch-action:pan-y}.facts{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div class="app">
<aside>
 <div class="head"><h1>Site Plan Viewer</h1><div class="sub">Run __RUN__ · screener plans and site plans · screening sketches from public maps, not surveys · <span class="draft">DRAFT zoning values</span></div></div>
 <div class="controls">
  <input id="q" type="search" placeholder="Search address, parcel, rank…" aria-label="Search">
  <div class="row2">
   <select id="sort" aria-label="Sort"><option value="rank">Sort: rank</option><option value="sf">Sort: building SF</option><option value="yield">Sort: SF per gross acre</option><option value="acres">Sort: county-map acres</option></select>
   <select id="fitf" aria-label="Building fit"><option value="">Any fit</option><option value="fits">Operator prototypes fit</option><option value="none">Operator prototypes don't fit</option><option value="cross">Cross-dock</option></select>
  </div>
  <div class="row2">
   <select id="landf" aria-label="Land today"><option value="">Land today: any</option><option value="raw_land">Raw land</option><option value="partly_usable">Partly usable</option><option value="not_raw_land">Not raw land</option><option value="unclear">Unclear</option><option value="none">Not reviewed</option></select>
   <select id="feasf" aria-label="Plan feasibility"><option value="">Any plan</option><option value="yes">Site plan: feasible</option><option value="clean">Site plan: fits, standard checks only</option><option value="no">Site plan: not feasible / hypothetical</option><option value="incomplete">Site plan: incomplete (inputs not checked)</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count" aria-live="polite"></div>
 </div>
 <div id="list" aria-label="Site plans"></div>
</aside>
<main>
 <div class="bar">
  <button id="prev" title="Previous (←)" aria-label="Previous plan">◀</button><button id="next" title="Next (→)" aria-label="Next plan">▶</button>
  <button id="zin" title="Zoom in (+)" aria-label="Zoom in">＋</button><button id="zout" title="Zoom out (−)" aria-label="Zoom out">－</button><button id="zfit" title="Fit (0)">Fit</button>
  <button id="cmp" title="Compare with another plan (c)">Compare</button>
  <select id="cmpsel" aria-label="Compare with" hidden></select>
  <label id="samewrap" hidden><input type="checkbox" id="same" checked> Same scale</label>
  <span class="sp"></span>
  <a class="btn" id="dl" download>Download SVG</a>
 </div>
 <div class="stage" id="stage">
  <div class="view" id="v1"><div class="vlabel" id="l1"></div><div class="canvas" id="c1"></div><div class="scalenote" id="s1" hidden></div></div>
  <div class="facts" id="facts"></div>
  <div class="view" id="v2" hidden><div class="vlabel" id="l2"></div><div class="canvas" id="c2"></div><div class="scalenote" id="s2" hidden></div></div>
 </div>
</main>
</div>
<script>
const PLANS = __DATA__;
const ST = {open:"Pursue",unchecked:"Not checked",doubt:"Open doubt",taken:"Probably taken",drop:"Likely drop",listed:"Listed"};
const COL = {open:"var(--open)",unchecked:"var(--unchecked)",doubt:"var(--doubt)",taken:"var(--taken)",drop:"var(--drop)",listed:"var(--listed)"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/\s+/g," ").trim();
const fmt = n => (n===null||n===undefined||n==="")?"?":Number(n).toLocaleString();
// Each inline copy of a plan gets its own pattern ids, so thumbnails and the
// main view never point at each other's patterns (ids are [A-Za-z][\w-]*,
// checked by the sanitiser in viewer.py).
let uid=0; const svgOf=p=>{const u="u"+(++uid)+"-";return p.svg.replace(/ id="([A-Za-z][A-Za-z0-9_-]*)"/g,(m,i)=>` id="${u}${i}"`).replace(/url\(#([A-Za-z][A-Za-z0-9_-]*)\)/g,(m,i)=>`url(#${u}${i})`);};
// A feasible plan held only by an entitlement gate sorts by its drawn floor area.
const sortSf = p => p.sf || (p.kind==="plan" && p.feasible===true && p.gated && p.gated.length ? p.sfIfAccess : 0);
const feasText = p => p.feasible===true?"feasible":p.feasible===null?"incomplete":(p.hypothetical?"no road access":"not feasible");
// The planner's read-out (screener.siteplan_assess): one status per plan.
const PS = {fits:"Fits: standard checks only",fits_with_conditions:"Fits with conditions",gated:"Fits: entitlement gate",hypothetical:"No road access",blocked:"Blocked as tested",incomplete:"Incomplete: run again",no_fit:"No building fits",not_planned:"Not planned"};
const PCOL = {fits:"var(--open)",fits_with_conditions:"var(--doubt)",gated:"var(--doubt)",hypothetical:"var(--drop)",blocked:"var(--drop)",incomplete:"var(--unchecked)",no_fit:"var(--drop)",not_planned:"var(--unchecked)"};
const yieldOf = p => (p.kind==="plan" && p.v4 && p.v4.coverage && p.v4.coverage.sf_per_gross_ac) || 0;
const filt = {status:new Set(), kind:new Set()};
let shown = [], cur = 0, cmpId = null;
function store(k,v){try{localStorage.setItem("spv:"+k,v)}catch(e){}}
function load(k){try{return localStorage.getItem("spv:"+k)}catch(e){return null}}
const LANDL = {raw_land:"raw land", partly_usable:"partly usable", not_raw_land:"not raw land", unclear:"unclear"};
const acresText = p => [p.taxAc!=null?`${p.taxAc} ac tax roll`:null, p.mapAc!=null?`${p.mapAc} ac county map`:null].filter(Boolean).join(" · ");

// chips with counts
const chipDefs = [["kind","run","Screener plans"],["kind","plan","Site plans"],...Object.entries(ST).map(([k,v])=>["status",k,v])];
for (const [g,k,label] of chipDefs){
  const n = PLANS.filter(p=>(g==="kind"?p.kind:p.status)===k).length;
  const b=document.createElement("button");b.className="chip";b.type="button";b.setAttribute("aria-pressed","false");b.dataset.g=g;b.dataset.k=k;
  b.innerHTML=(g==="status"?`<span class="dot s-${k}"></span>`:"")+esc(label)+` <span class="lbl">${n}</span>`;
  if(!n){b.disabled=true;b.title="No plans have this status";}
  b.onclick=()=>{const s=filt[g];s.has(k)?s.delete(k):s.add(k);b.setAttribute("aria-pressed",s.has(k));render();};
  $("#chips").appendChild(b);
}
["q","sort","fitf","landf","feasf"].forEach(id=>$("#"+id).addEventListener("input",()=>render()));

function match(p){
  const q=norm($("#q").value);
  if(q && !norm(`#${p.rank} ${p.title} ${p.pid} ${p.place}`).includes(q)) return false;
  if(filt.status.size && !filt.status.has(p.status)) return false;
  if(filt.kind.size && !filt.kind.has(p.kind)) return false;
  const f=$("#fitf").value;
  if(f==="fits" && !p.stdFits) return false;
  if(f==="none" && p.stdFits!==false) return false;
  if(f==="cross" && !/cross-dock/.test(p.fit)) return false;
  const lf=$("#landf").value; if(lf==="none" ? p.land : (lf && p.land!==lf)) return false;
  const ff=$("#feasf").value; if(ff==="yes" && !(p.kind==="plan" && p.feasible===true)) return false; if(ff==="clean" && !(p.kind==="plan" && p.assessment && p.assessment.status==="fits")) return false; if(ff==="no" && !(p.kind==="plan" && p.feasible===false)) return false; if(ff==="incomplete" && !(p.kind==="plan" && p.feasible===null)) return false;
  return true;
}
function clearFilters(){
  $("#q").value="";$("#fitf").value="";$("#landf").value="";$("#feasf").value="";filt.status.clear();filt.kind.clear();
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));render();
}
// Thumbnails are drawn only when their list row scrolls into view (R28).
const thumbs = ("IntersectionObserver" in window) ? new IntersectionObserver(es=>{for(const e of es){if(!e.isIntersecting)continue;const t=e.target.querySelector(".thumb");const p=shown[+e.target.dataset.i];if(t&&p&&!t.firstChild)t.innerHTML=svgOf(p);thumbs.unobserve(e.target);}},{root:null,rootMargin:"200px"}) : {observe:b=>{const p=shown[+b.dataset.i];b.querySelector(".thumb").innerHTML=svgOf(p);}};
function render(){
  const s=$("#sort").value;
  const curId = shown[cur]?.id || load("cur");
  shown = PLANS.filter(match).sort((a,b)=> s==="sf"? sortSf(b)-sortSf(a) || a.rank-b.rank : s==="yield"? yieldOf(b)-yieldOf(a) || a.rank-b.rank : s==="acres"? (b.mapAc||0)-(a.mapAc||0) : a.rank-b.rank || (a.kind==="run"?-1:1));
  const active = $("#q").value || $("#fitf").value || $("#landf").value || $("#feasf").value || filt.status.size || filt.kind.size;
  $("#count").innerHTML=`Showing ${shown.length} of ${PLANS.length} plans`+(active?' · <button type="button" id="clr">clear filters</button>':"");
  if(active) $("#clr").onclick=clearFilters;
  const L=$("#list"); L.innerHTML=""; if(thumbs.disconnect) thumbs.disconnect();
  if(!shown.length){L.innerHTML='<div class="empty">No plans match.</div>';}
  shown.forEach((p,i)=>{
    const b=document.createElement("button");b.className="item";b.type="button";
    b.innerHTML=`<div class="thumb" aria-hidden="true"></div><div><div class="it-t">${esc(p.title)}${p.kind==="plan"?'<span class="tag">plan</span>':""}${p.kind==="plan"&&p.feasible!==true?'<span class="tag" style="background:var(--drop)">'+esc(feasText(p))+'</span>':""}${p.kind==="plan"&&p.feasible===true&&p.assessment&&p.assessment.status!=="fits"?'<span class="tag" style="background:var(--doubt)">'+esc(p.assessment.status==="gated"?"gated":"conditions")+'</span>':""}</div>
      <div class="it-s"><span class="dot s-${p.status}"></span>${esc(ST[p.status])} · ${esc(p.place)}</div>
      <div class="it-s">${esc(p.sfText)} · ${esc(p.mapAc??p.taxAc)} ac${p.land?" · "+esc(LANDL[p.land]||p.land):""}</div></div>`;
    b.onclick=()=>show(i); b.dataset.i=i;
    L.appendChild(b); thumbs.observe(b);
  });
  const idx = shown.findIndex(p=>p.id===curId);
  show(idx<0?0:idx);
}
function show(i){
  if(!shown.length){
    ["c1","l1","facts","c2","l2"].forEach(id=>$("#"+id).innerHTML="");
    const a=$("#dl");a.removeAttribute("href");a.setAttribute("aria-disabled","true");return;
  }
  cur=(i+shown.length)%shown.length;
  const p=shown[cur]; store("cur",p.id);
  document.querySelectorAll(".item").forEach((el,j)=>{el.setAttribute("aria-current",j===cur?"true":"false");});
  document.querySelectorAll(".item")[cur]?.scrollIntoView({block:"nearest"});
  put(1,p); facts(p);
  const a=$("#dl"); if(a.dataset.url) URL.revokeObjectURL(a.dataset.url);
  a.dataset.url=URL.createObjectURL(new Blob([p.svg],{type:"image/svg+xml"})); a.href=a.dataset.url; a.download=`site-plan-${p.id}.svg`; a.removeAttribute("aria-disabled");
  if(cmpId!==null) fillCmp(p);
}
function factsPlan(p){
  const v=p.v4, b=v.building, tr=v.trailers, ca=v.cars, cv=v.coverage, de=v.detention, ac=v.access, gr=v.grading, q=v.quantities, A=p.assessment;
  const n1=x=>(x===null||x===undefined)?"?":Number(x).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
  const rows=[["Parcel",(p.pids&&p.pids.length>1)?p.pids.join(", "):p.pid],["Land today",(LANDL[p.land]||"not reviewed")+(p.landWhat?": "+p.landWhat:"")],["Zoning",p.zoning],["Zoning rules used",`${p.zoningRules||"default"} (DRAFT screening values, not a zoning determination)`],
    ["Layout",p.fit],["Building",b?`${fmt(b.sf)} SF · ${b.L_ft} x ${b.D_ft} ft · ${b.clear_height_ft} ft clear (assumed)`:"none"]];
  if(v.second_building) rows.push(["Second building",`${v.second_building.configuration}: ${fmt(v.second_building.sf)} SF${v.second_building.own_driveways?" (own driveways)":" (shares driveways)"}`]);
  if(tr&&ca&&cv&&de&&ac&&gr) rows.push(["Total",p.sfText],
    ["Yield",`${fmt(cv.sf_per_gross_ac)} SF/gross ac`+(A&&A.position&&A.band&&A.band.length===2?` · ${A.position} the comp band ${fmt(A.band[0])}-${fmt(A.band[1])}`:"")+` · FAR ${cv.gross_far}`],
    ["Dock doors",fmt(v.doors)+(A&&A.site&&A.site.doors_per_10k_sf!=null?` (${A.site.doors_per_10k_sf} per 10,000 SF)`:"")],["Trailer stalls",`${tr.total} (court rows ${tr.court_rows}, drop yard ${tr.drop_yards}) vs target ${tr.target}`],
    ["Car stalls",`${ca.provided} (required ${ca.required}; ADA ${ca.ada}; ${ca.stall}) — ${ca.basis}`],
    ["Coverage",`${cv.gross_ac} ac county map · impervious ${cv.impervious_ac} ac (${cv.impervious_pct}%)`+(A&&A.site&&A.site.building_coverage_pct!=null?` · building ${A.site.building_coverage_pct}%`:"")],
    ["Detention",`${de.storage_acft} ac-ft in ${de.ponds} pond(s) · ${de.fits?"fits":"does not fit"} · ${de.basis}`],
    ["Access",`${ac.truck_driveway?"truck":"no truck"}${ac.car_driveway?" + car":""} driveway(s) on ${ac.road||"no road"} · frontage ${fmt(ac.frontage_ft||0)} ft · truck route ${fmt(ac.truck_route_ft)} ft · car route ${fmt(ac.car_route_ft)} ft`],
    ["Grading",gr.relief_ft!=null?`relief ~${gr.relief_ft} ft · cut/fill ~${fmt(gr.cut_fill_cy||0)} CY · steep ${gr.steep_share_pct}%`+(gr.pad_elev_ft!=null?` · level pad at ${fmt(gr.pad_elev_ft)} ft: cut to ${gr.max_cut_ft} ft, fill to ${gr.max_fill_ft} ft`:"")+` — ${gr.basis}`:"no lidar"]);
  if(q) rows.push(["Takeoff (no prices)",`heavy paving ${fmt(q.heavy_paving_sf)} SF · light paving ${fmt(q.light_paving_sf)} SF · disturbed ${q.disturbed_ac} ac · pond footprint ${q.pond_footprint_ac} ac — ${q.basis}`]);
  if(p.gated&&p.gated.length) rows.push(["Entitlement gate",p.gated.join(", ")+(p.sf?" (the layout is feasible and its floor area is counted; check the gate before pursuing)":" (the layout is feasible, but its floor area is not counted until the gate is cleared)")]);
  const st=A?A.status:null;
  let h=`<h2>${esc(p.title)}</h2><div class="place">${esc(p.place)}</div>
   <span class="badge" style="background:${COL[p.status]}">${esc(ST[p.status])}</span><span class="badge" style="background:var(--test)">Site plan</span><span class="badge" style="background:${st?PCOL[st]:(p.feasible===true?"var(--open)":p.feasible===null?"var(--doubt)":"var(--drop)")}">${esc(st?PS[st]:feasText(p))}</span><span class="draft">DRAFT zoning</span>`;
  if(A&&A.headline) h+=`<div class="verdict" style="border-color:${PCOL[st]}">${esc(A.headline)}</div>`;
  if(A&&A.steps&&A.steps.length) h+=`<h3>Next steps, in order</h3><ol class="steps">${A.steps.map(x=>`<li><span class="lead">${esc(x.stage)} · ${esc(x.workstream)}</span><br>${esc(x.action)}${x.closes?`<br><span class="lbl">Closes with: ${esc(x.closes)}</span>`:""}</li>`).join("")}</ol>`;
  h+=`<h3>Key numbers</h3><dl>${rows.map(([k,x])=>`<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join("")}</dl>`;
  if(A&&A.yieldNotes&&A.yieldNotes.length) h+=`<h3>What holds the yield</h3><ul style="margin:4px 0;padding-left:18px;font-size:13px">${A.yieldNotes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(A&&A.land){const L=A.land, g=L.gross_ac||0, pc=x=>(g&&x!=null)?` (${Math.round(100*x/g)}%)`:"";
    const lr=[["Gross site, county map",L.gross_ac,1],["Draft setbacks and buffers",L.setbacks_buffers_ac,0],["Mapped constraints, test cut",L.constraints_ac,0],["Net: inside the paving envelope",L.net_ac,1],...(L.uses||[]).map(u=>[u.label,u.ac,0]),["Left unused inside the envelope",L.unused_net_ac,1],["Largest unused piece",L.largest_unused_ac,0]];
    h+=`<h3>Where the land goes</h3><table><tr><th>Use</th><th class="r">Acres (% of gross)</th></tr>${lr.map(([k,x,s])=>`<tr><td>${s?"<b>":""}${esc(k)}${s?"</b>":""}</td><td class="r">${esc(n1(x))}${esc(pc(x))}</td></tr>`).join("")}</table>`;}
  if(A&&A.compliance&&A.compliance.length){const cls=x=>x==="meets"?"ok":(x==="short"||x==="over")?"bad":x==="no draft value"?"lbl":"warn";
    h+=`<h3>Plan against the draft zoning values</h3><table><tr><th>Item</th><th>Draft value</th><th>Plan</th><th class="r">Margin</th><th>Status</th></tr>${A.compliance.map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.required)}</td><td>${esc(r.provided)}${r.note?`<br><span class="lbl">${esc(r.note)}</span>`:""}</td><td class="r">${r.margin!=null?(r.margin>=0?"+":"")+esc(r.margin)+" ft":""}</td><td class="${cls(r.status)}">${esc(r.status)}</td></tr>`).join("")}</table><p class="lbl">Draft screening values, not the adopted code: "meets" says the drawing honours the draft value.</p>`;}
  if(p.alternatives&&p.alternatives.length){const res=a=>a.geometryOk===true?'<span class="ok">passes</span>':a.geometryOk===null?"?":`<span class="bad">${esc((a.blocking&&a.blocking.length)?a.blocking.map(f=>f.replace(/_/g," ").toLowerCase()).join(", "):(a.route_problem?"no route":"fail"))}</span>`;
    h+=`<h3>Layouts compared</h3><table><tr><th>Layout (the plan drawn is first)</th><th class="r">SF</th><th class="r">Docks</th><th class="r">Trailers</th><th>Layout checks (not site feasibility)</th></tr>${p.alternatives.map(a=>`<tr><td>${esc(a.variant)}</td><td class="r">${fmt(a.sf)}</td><td class="r">${a.doors!=null?fmt(a.doors):""}</td><td class="r">${a.trailers!=null?esc(a.trailers)+" / "+esc(a.trailersTarget):""}</td><td>${res(a)}</td></tr>`).join("")}</table>`;
    if(A&&A.selection) h+=`<p style="font-size:13px;margin:4px 0">${esc(A.selection)}</p>`;}
  if(A&&A.conditions&&A.conditions.length){const KL={blocking:"blocks the plan",gate:"entitlement gate",site:"",standing:"every site",information:"for information"};
    h+=`<h3>Conditions: what to check, when, what closes it</h3>${A.conditions.map(c=>`<div class="cond k-${esc(c.kind)}"><b>${esc(c.n)}. ${esc(c.stage)} · ${esc(c.workstream)}</b>${KL[c.kind]?` <span class="lbl">(${esc(KL[c.kind])})</span>`:""}<br>${esc(c.action)}${c.closes?`<br><span class="lbl">Closes with: ${esc(c.closes)}</span>`:""}<div class="code">${esc(c.flag)}: ${esc(c.finding)}</div></div>`).join("")}`;}
  const fl=(arr,lab,col)=>arr&&arr.length?`<div class="note"><span class="lbl" style="color:${col}">${lab}</span><ul style="margin:4px 0 0;padding-left:18px">${arr.map(f=>`<li><b>${esc(f.flag)}</b>: ${esc(f.note)}</li>`).join("")}</ul></div>`:"";
  const flags=fl(p.flags1,"Severity 1 (likely kills or cuts the yield)","#b3261e")+fl(p.flags2,"Severity 2 (verify)","#8a5a00")+fl(p.flags3,"For information","#5d676e");
  h+=A?`<details><summary>Flags as the planner recorded them</summary>${flags}</details>`:flags;
  if((v.operator_decisions||[]).length) h+=`<details><summary>Operator decisions used for this plan</summary><dl>${v.operator_decisions.map(([k,x])=>`<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join("")}</dl></details>`;
  if(p.related){const r=PLANS.find(x=>x.id===p.related); if(r) h+=`<p><button type="button" id="sbs">Compare with the screener's plan</button></p>`;}
  if(p.note) h+=`<div class="note"><span class="lbl">Mark in decisions.csv:</span> ${esc(p.note)}</div>`;
  h+=`<p class="lbl">Screening test fit from public data: not a survey, civil design or zoning determination. Zoning values are DRAFT; detention ±30%; routes, fire access and grading are indicative. The actions are the usual next step for each flag; none was checked against a document.</p>`;
  $("#facts").innerHTML=h;
  const sb=$("#sbs"); if(sb) sb.onclick=()=>{cmpId=p.related;openCmp();};
}
function facts(p){
  if(p.kind==="plan") return factsPlan(p);
  const fr = p.frontage>0 ? `${fmt(Math.round(p.frontage))} ft (${p.frontageRoad})` : (p.frontageRoad || "none within 50 ft of a GDOT road");
  const rows=[["Parcel",p.pid],["Acres",acresText(p)+(p.open!=null?` · largest open part ${p.open} ac (county map)`:"")],["Zoning",p.zoning],["Grade",p.grade],
    ["Building drawn",p.fit+(p.sf?` · ${fmt(p.sf)} SF`:"")],["Detention pond",p.pond]];
  if(p.land) rows.push(["Land today",(LANDL[p.land]||p.land)+(p.landWhat?": "+p.landWhat:"")]);
  if(p.kind==="run") rows.push(["Ground",`flood ${p.flood}%, wetlands ${p.wet}%, steep ${p.steep}% (steep ground not located)`],["Frontage",fr],["Access",p.exit]);
  let h=`<h2>${esc(p.title)}</h2><div class="place">${esc(p.place)}</div>
   <span class="badge" style="background:${COL[p.status]}">${esc(ST[p.status])}</span>
   <dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  if(p.note) h+=`<div class="note"><span class="lbl">Mark in decisions.csv:</span> ${esc(p.note)}</div>`;
  if(p.skeptic) h+=`<div class="note"><span class="lbl">Document check: skeptic verdict</span> ${esc(p.skeptic)}${p.headline?`<br><span class="lbl">Headline (agent reading, not verified):</span> ${esc(p.headline)}`:""}</div>`;
  if(p.related){const r=PLANS.find(x=>x.id===p.related); if(r) h+=`<p><button type="button" id="sbs">Compare with ${esc(r.title)}${r.kind==="run"?" (run plan)":""}</button></p>`;}
  if(p.maps && /^https:\/\/www\.google\.com\/maps\//.test(p.maps)) h+=`<p><a href="${esc(p.maps)}" target="_blank" rel="noopener noreferrer">Open in Google Maps</a></p>`;
  h+=`<p class="lbl">North up, from the county parcel map. Blue: floodplain, mapped wetlands and water, easements, protected land (and any test cut). Green: largest open part. Orange: building envelope (building + truck court + trailer row where stated). Teal: detention pond allowance. Steep ground, utility easements, zoning setbacks beyond 25 ft and car parking are not drawn.</p>`;
  $("#facts").innerHTML=h;
  const sb=$("#sbs"); if(sb) sb.onclick=()=>{cmpId=p.related;openCmp();};
}
// zoom & pan
const Z={1:{s:1,x:0,y:0,fitted:true,w:0,h:0},2:{s:1,x:0,y:0,fitted:true,w:0,h:0}};
const planOf={1:null,2:null};
function put(n,p){
  planOf[n]=p; const c=$("#c"+n); c.innerHTML=svgOf(p);
  $("#l"+n).innerHTML=`${esc(p.title)}<span class="mini"> · ${esc(p.sfText)} · ${esc(acresText(p))} · ${esc(ST[p.status])}</span>`;
  requestAnimationFrame(refit);
}
function apply(n){const z=Z[n];$("#c"+n).style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`;$("#v"+n).classList.toggle("fitted",z.fitted);}
function dims(n){const svg=$("#c"+n).querySelector("svg");return svg?[+svg.getAttribute("width")||640,+svg.getAttribute("height")||800]:null;}
function fitScale(n){const v=$("#v"+n),d=dims(n);if(!d)return null;return Math.min((v.clientWidth-24)/d[0],(v.clientHeight-60)/d[1]);}
function place(n,s){const v=$("#v"+n),d=dims(n);if(!d)return;Z[n]={s,x:(v.clientWidth-d[0]*s)/2,y:Math.max(44,(v.clientHeight-d[1]*s)/2+16),fitted:true,w:v.clientWidth,h:v.clientHeight};apply(n);}
function refit(){
  const cmpOn = cmpId!==null && !$("#v2").hidden;
  const same = cmpOn && $("#same").checked && planOf[1]?.fpp && planOf[2]?.fpp;
  if(same){
    // equal feet per screen pixel in both panes: s_i = k * fpp_i, k the largest that fits both
    const k=Math.min(fitScale(1)/planOf[1].fpp, fitScale(2)/planOf[2].fpp);
    place(1,k*planOf[1].fpp); place(2,k*planOf[2].fpp);
    $("#s1").hidden=$("#s2").hidden=false; $("#s1").textContent=$("#s2").textContent="Same scale in both panes";
  } else {
    place(1,fitScale(1)); if(cmpOn) place(2,fitScale(2));
    $("#s1").hidden=$("#s2").hidden=!cmpOn; if(cmpOn) $("#s1").textContent=$("#s2").textContent="Not to the same scale: check each scale bar";
  }
}
function zoomAt(n,f,cx,cy){
  const z=Z[n], v=$("#v"+n); if(cx===undefined){cx=v.clientWidth/2;cy=v.clientHeight/2;}
  const ns=Math.min(12,Math.max(0.05,z.s*f)); z.x=cx-(cx-z.x)*ns/z.s; z.y=cy-(cy-z.y)*ns/z.s; z.s=ns; z.fitted=false; apply(n);
}
for (const n of [1,2]){
  const v=$("#v"+n); let drag=null; const pts=new Map(); let pinch=null;
  v.addEventListener("wheel",e=>{e.preventDefault();const r=v.getBoundingClientRect();zoomAt(n,e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  v.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch" && Z[n].fitted && pts.size===0){pts.set(e.pointerId,[e.clientX,e.clientY]);drag=null;return;}
    v.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1)drag=[e.clientX,e.clientY]; else {drag=null;pinch=null;}
  });
  v.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=v.getBoundingClientRect();
      if(pinch) zoomAt(n,d/pinch,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top); pinch=d; return;}
    if(drag){Z[n].x+=e.clientX-drag[0];Z[n].y+=e.clientY-drag[1];Z[n].fitted=false;drag=[e.clientX,e.clientY];apply(n);}
  });
  const up=e=>{pts.delete(e.pointerId);pinch=null;if(pts.size===1){drag=[...pts.values()][0].slice();}else if(!pts.size)drag=null;};
  v.addEventListener("pointerup",up);v.addEventListener("pointercancel",up);
  v.addEventListener("dblclick",()=>refit());
}
const both=f=>{zoomAt(1,f);if(cmpId!==null)zoomAt(2,f);};
$("#zin").onclick=()=>both(1.25);$("#zout").onclick=()=>both(0.8);$("#zfit").onclick=refit;
$("#prev").onclick=()=>show(cur-1);$("#next").onclick=()=>show(cur+1);
$("#same").onchange=refit;
// compare
function openCmp(){
  $("#stage").classList.add("cmp");$("#v2").hidden=false;$("#facts").hidden=true;$("#cmpsel").hidden=false;$("#samewrap").hidden=false;$("#cmp").textContent="Close compare";
  fillCmp(shown[cur]);
}
function closeCmp(){
  cmpId=null;$("#stage").classList.remove("cmp");$("#v2").hidden=true;$("#facts").hidden=false;$("#cmpsel").hidden=true;$("#samewrap").hidden=true;$("#cmp").textContent="Compare";
  planOf[2]=null;requestAnimationFrame(refit);
}
function fillCmp(p){
  if(!p) return;
  const sel=$("#cmpsel"); sel.innerHTML=PLANS.filter(x=>x.id!==p.id).sort((a,b)=>a.rank-b.rank).map(x=>`<option value="${esc(x.id)}">${esc(x.title)}${x.kind==="plan"?" (site plan)":""}</option>`).join("");
  if(!cmpId || cmpId===p.id) cmpId=p.related || PLANS.find(x=>x.rank===p.rank && x.id!==p.id)?.id || sel.options[0]?.value;
  sel.value=cmpId; const q=PLANS.find(x=>x.id===cmpId); if(q) put(2,q);
}
$("#cmpsel").onchange=e=>{cmpId=e.target.value;put(2,PLANS.find(x=>x.id===cmpId));};
$("#cmp").onclick=()=>{ if(cmpId!==null) closeCmp(); else {cmpId=undefined;openCmp();} };
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.target.matches("input,select,textarea"))return;
  if(e.key==="ArrowRight"||e.key==="j")show(cur+1); else if(e.key==="ArrowLeft"||e.key==="k")show(cur-1);
  else if(e.key==="+"||e.key==="=")both(1.25); else if(e.key==="-")both(0.8); else if(e.key==="0")refit(); else if(e.key==="c")$("#cmp").click();
});
let rt=null;
addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{
  for(const n of [1,2]){const v=$("#v"+n),z=Z[n];if(v.hidden)continue;
    if(Math.abs(v.clientWidth-z.w)<2 && Math.abs(v.clientHeight-z.h)<60) continue;   // URL bar show/hide on phones
    if(z.fitted) refit(); else {z.w=v.clientWidth;z.h=v.clientHeight;}
  }},120);});
render();
</script></body></html>

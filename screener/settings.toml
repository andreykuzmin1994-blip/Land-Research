# Land screener settings. Edit freely; every run reads this file.

[run]
county = "fulton"
briefs = 25          # one-page briefs for the top N parcels
slope = true         # USGS lidar slope check, about 1 second per parcel
workers = 6          # parallel slope requests
cache_days = 7       # reuse downloaded map data for this many days
slope_cache_days = 3650   # reuse lidar slope answers this long (the survey is from 2018-19); --refresh-slope asks again

[area]
min_acres = 5
max_acres = 50
# Fulton jurisdictions to search. North Fulton cities (Alpharetta, Roswell,
# Milton, Johns Creek, Sandy Springs, Mountain Park) are left out by default.
jurisdictions = [
  "South Fulton / unincorporated", "Atlanta", "East Point", "College Park",
  "Hapeville", "Fairburn", "Union City", "Palmetto", "Chattahoochee Hills",
  "Fulton Industrial District",
]

[screens]
max_improvement_value = 250000  # skip parcels already built on (and improvements > half the land value)
max_flood_pct = 40              # % of parcel in the 100-year floodplain
max_floodway_pct = 10           # % in a regulatory floodway
max_wetland_pct = 20            # % mapped wetlands (ponds/streams counted separately)
max_protected_pct = 10          # overlap with protected land or conservation easements
max_steep_pct = 40              # % of parcel steeper than 15% slope
min_usable_acres = 4            # acres left after all of the above
contamination_buffer_ft = 500   # flag listed contamination sites this close
exclude_tax_exempt = true
exclude_government = true
exclude_developer_owned = true  # Prologis, Link, Exeter, ... already own it
exclude_utility_owned = true    # railroads, Georgia Power, pipelines
exclude_association_owned = true  # homeowners' / community associations (subdivision common areas)
exclude_listed = true           # parcels you mark "listed" in inputs/decisions.csv
# Optional screens (off by default; these otherwise only lower the score):
max_exit_miles = 0              # drop parcels farther than this from an interstate exit (0 = off)
exclude_hard_entitlement = false  # drop parcels zoned AND planned residential / conservation

[owners]
# Same-owner groups (flags only; not a score or a screen). Parcels with the
# exact same tax-roll owner name and mailing address count as one group, and
# group members this close on the county parcel map count as adjacent. The
# default bridges digitizing slivers, not a road right-of-way (40-80 ft).
adjacency_gap_ft = 10

[fit]
# Building fit on the open ground (a report fact only; not a score or a
# screen). The copied prototype envelopes are fixed in sitefit.py.
enabled = true
max_parcels = 0      # fit only the top N ranked parcels (0 = all)

[detention]
# Stormwater detention allowance (a report fact only; not a score or a
# screen): places the copied 400 x 200 ft prototype pond (detention.py) on
# the open ground left beside the fitted building envelope. A rough
# allowance: no hydrology, no Atlas 14 rainfall, no local detention rules.
# No web service is called.
enabled = true
max_parcels = 0      # check only the top N ranked parcels (0 = all)

[soils]
# SSURGO soils from USDA Soil Data Access (a report fact only; not a score or
# a screen): dominant hydrologic soil group and the shares mapped hydric,
# poorly drained, and very limited for dwellings without basements. One
# request per ranked parcel, after the sort; the service is down nightly
# about 00:00-02:00 Mountain time.
enabled = true
max_parcels = 250    # check only the top N ranked parcels (0 = all)
workers = 3          # parallel requests (1-3; kept below the shared 6)

[frontage]
# Road frontage from GDOT's public road centrelines (Functional Class map
# service; a report fact only, not a score or a screen): the parcel line
# within 50 ft of a centreline, the class and route of the longest-frontage
# road, frontage along interstates / freeways / ramps (no driveway access)
# and along private roads (not public access).
# Curb cuts are not checked. One request per ranked parcel, after the sort.
enabled = true
max_parcels = 250    # check only the top N ranked parcels (0 = all)
workers = 3          # parallel requests (1-3; kept below the shared 6)

[grade]
# Lead grade (a report fact only; not a score or a screen, and the ranking
# is unchanged): a fixed rule over the checks above sorts leads.md and adds
# lead_grade / lead_found / lead_not_checked to ranked.csv. A = zoning path
# by right or likely, a building envelope fits, a pond fits beside it,
# public road frontage, and no watch item found; B = one item found or not
# checked; C = two or more; blocked = entitlement "hard". See grade.py.
enabled = true
min_frontage_ft = 50          # less public road frontage than this counts as found
max_hydric_pct = 25           # hydric soil share at or above this counts as found
max_poorly_drained_pct = 25   # poorly drained soil share at or above this counts as found
owner_next_door = true        # count "the same owner holds a built-on parcel next door"
recent_purchase_years = 5     # count a purchase more recent than this (0 = off)
digest_max = 40               # most leads listed in leads.md (A first, then B); each gets a brief
